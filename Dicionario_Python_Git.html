": "Path(\"vendas.xlsx\").stem", "quando": "para usar o nome do arquivo como identificação, sem o .xlsx.", "grupo": "Python"}, {"codigo": "pathlib.Path", "categoria": "Módulos (pathlib)", "oque": "Ferramenta moderna para trabalhar com caminhos de pastas e arquivos.", "exemplo": "from pathlib import Path", "quando": "para lidar com pastas e arquivos de forma organizada.", "grupo": "Python"}, {"codigo": "__all__", "categoria": "Módulos (Python)", "oque": "Lista dos nomes que um módulo exporta quando alguém usa import *.", "exemplo": "__all__ = [\"por_canal\", \"resumo\"]", "quando": "para controlar quais funções ficam disponíveis para quem importar o seu módulo.", "grupo": "Python"}, {"codigo": "__name__ == \"__main__\"", "categoria": "Módulos (Python)", "oque": "Faz um bloco rodar só quando o arquivo é executado diretamente, e não quando é importado.", "exemplo": "if __name__ == \"__main__\": main()", "quando": "para separar o código de teste do código que será reutilizado.", "grupo": "Python"}, {"codigo": "import os", "categoria": "Módulos (Python)", "oque": "Biblioteca para conversar com o computador: pastas e arquivos.", "exemplo": "os.getcwd()", "quando": "para descobrir em qual pasta o programa está rodando.", "grupo": "Python"}, {"codigo": "import statistics", "categoria": "Módulos (Python)", "oque": "Biblioteca com funções estatísticas básicas, como média.", "exemplo": "from statistics import mean", "quando": "para calcular médias sem instalar nada extra.", "grupo": "Python"}, {"codigo": "import time", "categoria": "Módulos (Python)", "oque": "Biblioteca de tempo. time.time() mede quantos segundos se passaram.", "exemplo": "inicio = time.time()", "quando": "para medir quanto tempo um código demora, por exemplo comparando loop e NumPy.", "grupo": "Python"}, {"codigo": "none", "categoria": "Nulo", "oque": "Representa a ausência de valor.", "exemplo": "x = None", "quando": "\"Nada aqui\": um espaço vazio de propósito.", "grupo": "Python"}, {"codigo": "np.random.randint()", "categoria": "NumPy (Aleatórios)", "oque": "Gera números inteiros aleatórios.", "exemplo": "np.random.randint(50, 1000, (4, 3))", "quando": "para criar uma tabela de números inteiros de exemplo.", "grupo": "Bibliotecas"}, {"codigo": "np.random.seed()", "categoria": "NumPy (Aleatórios)", "oque": "Fixa a sequência de números aleatórios para o resultado se repetir.", "exemplo": "np.random.seed(42)", "quando": "em exercícios, para que todos tenham o mesmo resultado.", "grupo": "Bibliotecas"}, {"codigo": "np.random.uniform()", "categoria": "NumPy (Aleatórios)", "oque": "Gera números decimais aleatórios entre um mínimo e um máximo.", "exemplo": "np.random.uniform(50, 5000, 500)", "quando": "para simular valores de vendas.", "grupo": "Bibliotecas"}, {"codigo": ".ndim", "categoria": "NumPy (Arrays)", "oque": "Número de dimensões: 1 para lista simples, 2 para tabela.", "exemplo": "print(v.ndim)", "quando": "para saber se o array é uma lista ou uma matriz.", "grupo": "Bibliotecas"}, {"codigo": "dtype (NumPy)", "categoria": "NumPy (Arrays)", "oque": "Tipo dos dados do array. Todos os itens têm o mesmo tipo.", "exemplo": "print(v.dtype) # float64", "quando": "para conferir se os números são inteiros ou decimais antes de calcular.", "grupo": "Bibliotecas"}, {"codigo": "np.arange()", "categoria": "NumPy (Arrays)", "oque": "Cria uma sequência de números, como o range do Python.", "exemplo": "np.arange(1, 32)", "quando": "para gerar uma sequência, como os dias do mês.", "grupo": "Bibliotecas"}, {"codigo": "np.array()", "categoria": "NumPy (Arrays)", "oque": "Cria um array (vetor ou matriz) a partir de uma lista.", "exemplo": "v = np.array([120.5, 340.0, 89.9])", "quando": "para fazer contas rápidas com muitos números de uma vez.", "grupo": "Bibliotecas"}, {"codigo": "np.linspace()", "categoria": "NumPy (Arrays)", "oque": "Cria valores igualmente espaçados entre dois limites.", "exemplo": "np.linspace(0, 1000, 10)", "quando": "para criar faixas de valores com o mesmo espaçamento.", "grupo": "Bibliotecas"}, {"codigo": "np.newaxis", "categoria": "NumPy (Arrays)", "oque": "Acrescenta uma dimensão ao array.", "exemplo": "v[:, np.newaxis]", "quando": "em cálculos avançados com broadcasting. Uso avançado.", "grupo": "Bibliotecas"}, {"codigo": "np.ones()", "categoria": "NumPy (Arrays)", "oque": "Cria um array preenchido com uns.", "exemplo": "np.ones(3)", "quando": "para criar um array de base para cálculos.", "grupo": "Bibliotecas"}, {"codigo": "np.zeros()", "categoria": "NumPy (Arrays)", "oque": "Cria um array preenchido com zeros.", "exemplo": "np.zeros(5, dtype=bool)", "quando": "para preparar um espaço que será preenchido depois.", "grupo": "Bibliotecas"}, {"codigo": "erro de broadcasting", "categoria": "NumPy (Conceitos)", "oque": "Acontece quando as formas (shapes) dos arrays não combinam. O NumPy compara as dimensões da direita para a esquerda, e cada par precisa ser igual ou ter um 1.", "exemplo": "(3, 4) + (3,) dá erro, mas (3, 4) + (4,) funciona", "quando": "Para entender a mensagem de erro de shape ao operar arrays de tamanhos diferentes.", "grupo": "Bibliotecas"}, {"codigo": "ndarray", "categoria": "NumPy (Conceitos)", "oque": "Objeto central do NumPy: uma grade de valores do mesmo tipo, guardada de forma contígua na memória, que faz contas numéricas muito rápido.", "exemplo": "np.array([120.50, 340.00])", "quando": "Quando precisar fazer cálculos em muitos números de uma vez.", "grupo": "Bibliotecas"}, {"codigo": "ufunc (função universal)", "categoria": "NumPy (Conceitos)", "oque": "Função que age em cada elemento de um array, sem precisar de for, e aplica broadcasting automaticamente.", "exemplo": "np.sqrt(valores)", "quando": "Para aplicar uma conta a todos os valores de uma vez.", "grupo": "Bibliotecas"}, {"codigo": "np.max()", "categoria": "NumPy (Estatística)", "oque": "Retorna o maior valor do array.", "exemplo": "np.max(valores)", "quando": "Para descobrir a maior venda.", "grupo": "Bibliotecas"}, {"codigo": "np.mean()", "categoria": "NumPy (Estatística)", "oque": "Média dos valores do array.", "exemplo": "np.mean(v)", "quando": "para o valor médio de um array.", "grupo": "Bibliotecas"}, {"codigo": "np.median()", "categoria": "NumPy (Estatística)", "oque": "Valor do meio do array.", "exemplo": "np.median(v)", "quando": "quando há valores extremos e a média não representa bem os dados.", "grupo": "Bibliotecas"}, {"codigo": "np.min()", "categoria": "NumPy (Estatística)", "oque": "Retorna o menor valor do array.", "exemplo": "np.min(valores)", "quando": "Para descobrir a menor venda.", "grupo": "Bibliotecas"}, {"codigo": "np.percentile()", "categoria": "NumPy (Estatística)", "oque": "Valor abaixo do qual fica certa porcentagem dos dados.", "exemplo": "np.percentile(v, 90)", "quando": "para achar o limite dos 10% mais altos.", "grupo": "Bibliotecas"}, {"codigo": "np.round()", "categoria": "NumPy (Estatística)", "oque": "Arredonda os valores do array para uma quantidade de casas decimais.", "exemplo": "np.round(valores, 2)", "quando": "Para mostrar valores em dinheiro com duas casas.", "grupo": "Bibliotecas"}, {"codigo": "np.sqrt()", "categoria": "NumPy (Estatística)", "oque": "Raiz quadrada de cada elemento.", "exemplo": "np.sqrt(16) # 4.0", "quando": "em cálculos de distância ou de desvio.", "grupo": "Bibliotecas"}, {"codigo": "np.std()", "categoria": "NumPy (Estatística)", "oque": "Desvio padrão do array.", "exemplo": "np.std(v)", "quando": "para medir a dispersão dos valores.", "grupo": "Bibliotecas"}, {"codigo": "np.sum()", "categoria": "NumPy (Estatística)", "oque": "Soma os elementos do array. Com uma condição, conta quantos atendem a ela.", "exemplo": "np.sum(v > 2000)", "quando": "para contar quantos valores atendem a uma regra.", "grupo": "Bibliotecas"}, {"codigo": "np.where()", "categoria": "NumPy (Estatística)", "oque": "Escolhe um valor se a condição for verdadeira e outro se for falsa, para cada item.", "exemplo": "np.where(v >= 2000, \"Alta\", \"Baixa\")", "quando": "para classificar ou alterar valores de um array de uma vez só, como um se/senão para todos.", "grupo": "Bibliotecas"}, {"codigo": "import numpy as np", "categoria": "NumPy (Importação)", "oque": "Carrega o NumPy com o apelido np, que é como ele aparece em todo o curso.", "exemplo": "import numpy as np", "quando": "No início de qualquer código que use NumPy.", "grupo": "Bibliotecas"}, {"codigo": "np.select", "categoria": "NumPy: Condições", "oque": "Escolhe o valor de acordo com várias condições, testadas na ordem.", "exemplo": "np.select([v < 1000, v < 2500], ['Baixo', 'Médio'], default='Alto')", "quando": "Criar uma coluna com três ou mais categorias. O default é o valor do 'resto'.", "grupo": "Bibliotecas"}, {"codigo": "np.where", "categoria": "NumPy: Condições", "oque": "Escolhe um valor se a condição for verdadeira e outro se for falsa.", "exemplo": "np.where(df['Valor_Venda'] > 2000, 'Alto', 'Baixo')", "quando": "Criar uma coluna com duas opções. Ordem: condição, valor se sim, valor se não.", "grupo": "Bibliotecas"}, {"codigo": "operadores de comparação", "categoria": "Operadores", "oque": "Comparam dois valores e dão True ou False. São: == (igual), != (diferente), < (menor), > (maior), <= (menor ou igual) e >= (maior ou igual).", "exemplo": "ano <= 3", "quando": "Para montar condições de if e de while.", "grupo": "Python"}, {"codigo": "%", "categoria": "Operadores Aritméticos", "oque": "Retorna o resto da divisão inteira.", "exemplo": "3750 % 300 # Retorna 150", "quando": "Mostra o que sobrou da divisão.", "grupo": "Python"}, {"codigo": "*", "categoria": "Operadores Aritméticos", "oque": "Multiplica dois valores.", "exemplo": "250.00 * 5 # Retorna 1250.00", "quando": "\"Vezes\".", "grupo": "Python"}, {"codigo": "**", "categoria": "Operadores Aritméticos", "oque": "Eleva a base à potência do expoente.", "exemplo": "1.05 ** 12 # Retorna aprox. 1.795", "quando": "Potência. Serve para juros: 1.05 ** 12 mostra o crescimento de 5% ao ano durante 12 anos.", "grupo": "Python"}, {"codigo": "+", "categoria": "Operadores Aritméticos", "oque": "Soma dois valores numéricos.", "exemplo": "1250.00 + 980.50 # Retorna 2230.50", "quando": "\"Mais\".", "grupo": "Python"}, {"codigo": "-", "categoria": "Operadores Aritméticos", "oque": "Subtrai o segundo valor do primeiro.", "exemplo": "1250.00 - 125.00 # Retorna 1125.00", "quando": "\"Menos\".", "grupo": "Python"}, {"codigo": "/", "categoria": "Operadores Aritméticos", "oque": "Divide o primeiro valor pelo segundo (resultado com vírgula).", "exemplo": "3750.00 / 3 # Retorna 1250.0", "quando": "Dividir, mantendo as casas decimais.", "grupo": "Python"}, {"codigo": "//", "categoria": "Operadores Aritméticos", "oque": "Divide e retorna só a parte inteira do resultado.", "exemplo": "3750 // 300 # Retorna 12", "quando": "Quantas vezes o 300 cabe no 3750? Doze vezes.", "grupo": "Python"}, {"codigo": "@", "categoria": "Operadores Aritméticos", "oque": "Multiplicação de matrizes (tabelas numéricas avançadas).", "exemplo": "matriz_a @ matriz_b", "quando": "Operação de análise avançada. Pode ignorar por enquanto.", "grupo": "Python"}, {"codigo": "&", "categoria": "Operadores Bit a Bit", "oque": "E bit a bit (compara os bits dos números).", "exemplo": "5 & 3 # Retorna 1", "quando": "Uso avançado: compara números no formato binário.", "grupo": "Python"}, {"codigo": "<<", "categoria": "Operadores Bit a Bit", "oque": "Desloca os bits para a esquerda (cada passo dobra o valor).", "exemplo": "1 << 3 # Retorna 8", "quando": "Uso avançado.", "grupo": "Python"}, {"codigo": ">>", "categoria": "Operadores Bit a Bit", "oque": "Desloca os bits para a direita (cada passo divide por 2).", "exemplo": "8 >> 2 # Retorna 2", "quando": "Uso avançado.", "grupo": "Python"}, {"codigo": "^", "categoria": "Operadores Bit a Bit", "oque": "OU exclusivo bit a bit.", "exemplo": "5 ^ 3 # Retorna 6", "quando": "Uso avançado.", "grupo": "Python"}, {"codigo": "|", "categoria": "Operadores Bit a Bit", "oque": "OU bit a bit (compara os bits dos números).", "exemplo": "5 | 3 # Retorna 7", "quando": "Uso avançado.", "grupo": "Python"}, {"codigo": "~", "categoria": "Operadores Bit a Bit", "oque": "Inverte todos os bits de um inteiro.", "exemplo": "~5 # Retorna -6", "quando": "Uso avançado.", "grupo": "Python"}, {"codigo": "in", "categoria": "Operadores de Associação", "oque": "Verifica se um item está dentro de uma sequência.", "exemplo": "'a' in 'banana' # Retorna True", "quando": "\"Está dentro?\".", "grupo": "Python"}, {"codigo": "not in", "categoria": "Operadores de Associação", "oque": "Verifica se um item NÃO está dentro de uma sequência.", "exemplo": "'z' not in 'banana' # Retorna True", "quando": "\"Não está dentro?\".", "grupo": "Python"}, {"codigo": "%=", "categoria": "Operadores de Atribuição", "oque": "Guarda o resto da divisão na mesma variável.", "exemplo": "n %= 2", "quando": "Guarda só o que sobra da divisão.", "grupo": "Python"}, {"codigo": "**=", "categoria": "Operadores de Atribuição", "oque": "Eleva a potência e guarda o resultado.", "exemplo": "base **= 2", "quando": "Eleva o valor guardado ao quadrado.", "grupo": "Python"}, {"codigo": "*=", "categoria": "Operadores de Atribuição", "oque": "Multiplica e guarda o resultado na mesma variável.", "exemplo": "preco *= 2", "quando": "Dobra o valor guardado.", "grupo": "Python"}, {"codigo": "+=", "categoria": "Operadores de Atribuição", "oque": "Soma e guarda o resultado na mesma variável.", "exemplo": "total += 100 # igual a total = total + 100", "quando": "\"Acrescenta 100 ao que já existe\".", "grupo": "Python"}, {"codigo": "-=", "categoria": "Operadores de Atribuição", "oque": "Subtrai e guarda o resultado na mesma variável.", "exemplo": "saldo -= 50 # igual a saldo = saldo - 50", "quando": "\"Tira 50 do que já existe\".", "grupo": "Python"}, {"codigo": "//=", "categoria": "Operadores de Atribuição", "oque": "Divisão inteira e guarda o resultado.", "exemplo": "n //= 10", "quando": "Divide e guarda só a parte inteira.", "grupo": "Python"}, {"codigo": "/=", "categoria": "Operadores de Atribuição", "oque": "Divide e guarda o resultado na mesma variável.", "exemplo": "total /= 3", "quando": "Divide o valor guardado por 3.", "grupo": "Python"}, {"codigo": ":=", "categoria": "Operadores de Atribuição", "oque": "Guarda um valor dentro de uma pergunta ou conta.", "exemplo": "if (n := len(lista)) > 3: ...", "quando": "Guarda e testa ao mesmo tempo. Uso avançado.", "grupo": "Python"}, {"codigo": "=", "categoria": "Operadores de Atribuição", "oque": "Atribui um valor a uma variável.", "exemplo": "vendas = 1250.00", "quando": "Guarda o valor numa caixinha com nome.", "grupo": "Python"}, {"codigo": "is", "categoria": "Operadores de Identidade", "oque": "Verifica se duas variáveis apontam para o mesmo objeto.", "exemplo": "x is None", "quando": "\"É exatamente a mesma coisa?\".", "grupo": "Python"}, {"codigo": "is not", "categoria": "Operadores de Identidade", "oque": "Verifica se duas variáveis não apontam para o mesmo objeto.", "exemplo": "x is not None", "quando": "\"É diferente de nada?\".", "grupo": "Python"}, {"codigo": "and", "categoria": "Operadores Lógicos", "oque": "E: só é verdadeiro se as duas partes forem verdadeiras.", "exemplo": "True and False # Retorna False", "quando": "Precisa dos dois: \"tem chuva E tem sol\".", "grupo": "Python"}, {"codigo": "not", "categoria": "Operadores Lógicos", "oque": "NÃO: inverte o valor.", "exemplo": "not True # Retorna False", "quando": "Inverte: o que era sim vira não.", "grupo": "Python"}, {"codigo": "or", "categoria": "Operadores Lógicos", "oque": "OU: é verdadeiro se pelo menos uma parte for verdadeira.", "exemplo": "True or False # Retorna True", "quando": "Basta um: \"tem café OU tem chá\".", "grupo": "Python"}, {"codigo": "!=", "categoria": "Operadores Relacionais (Comparação)", "oque": "Compara se dois valores são diferentes.", "exemplo": "vendas != 0 # Retorna True", "quando": "\"É diferente de?\".", "grupo": "Python"}, {"codigo": "<", "categoria": "Operadores Relacionais (Comparação)", "oque": "Verifica se o primeiro valor é menor que o segundo.", "exemplo": "3 < 5 # Retorna True", "quando": "\"É menor que?\".", "grupo": "Python"}, {"codigo": "<=", "categoria": "Operadores Relacionais (Comparação)", "oque": "Verifica se é menor ou igual.", "exemplo": "ano <= 3", "quando": "\"É menor ou igual a?\".", "grupo": "Python"}, {"codigo": "==", "categoria": "Operadores Relacionais (Comparação)", "oque": "Compara se dois valores são iguais.", "exemplo": "vendas == 1250.00 # Retorna True", "quando": "\"É igual a?\" (são dois sinais de igual).", "grupo": "Python"}, {"codigo": ">", "categoria": "Operadores Relacionais (Comparação)", "oque": "Verifica se o primeiro valor é maior que o segundo.", "exemplo": "5 > 3 # Retorna True", "quando": "\"É maior que?\".", "grupo": "Python"}, {"codigo": ">=", "categoria": "Operadores Relacionais (Comparação)", "oque": "Verifica se é maior ou igual.", "exemplo": "vendas >= 50000", "quando": "\"É maior ou igual a?\".", "grupo": "Python"}, {"codigo": ".rank()", "categoria": "Organização (Pandas)", "oque": "Dá uma posição (1º, 2º, 3º...) a cada valor.", "exemplo": "df[\"Valor_Venda\"].rank(ascending=False)", "quando": "para criar um ranking de vendas.", "grupo": "Bibliotecas"}, {"codigo": ".reset_index()", "categoria": "Organização (Pandas)", "oque": "Transforma o índice em coluna comum e renumera as linhas.", "exemplo": "df.groupby(\"Região\")[\"Valor_Venda\"].sum().reset_index()", "quando": "depois de groupby, para voltar a ter uma tabela normal, necessária para o merge.", "grupo": "Bibliotecas"}, {"codigo": ".set_index()", "categoria": "Organização (Pandas)", "oque": "Escolhe uma coluna para ser o nome das linhas.", "exemplo": "df.set_index(\"Data\")", "quando": "quando uma coluna identifica as linhas melhor que os números.", "grupo": "Bibliotecas"}, {"codigo": ".sort_values()", "categoria": "Organização (Pandas)", "oque": "Ordena a tabela pelos valores de uma coluna.", "exemplo": "df.sort_values(\"Valor_Venda\", ascending=False)", "quando": "para colocar o maior ou o menor valor no topo.", "grupo": "Bibliotecas"}, {"codigo": ".sort_values() por várias colunas", "categoria": "Organização (pandas)", "oque": "Ordena por mais de uma coluna, com direção diferente para cada uma.", "exemplo": "df.sort_values([\"regiao\", \"valor\"], ascending=[True, False])", "quando": "para ordenar por região de A a Z e, dentro dela, do maior valor para o menor.", "grupo": "Bibliotecas"}, {"codigo": "reset_index()", "categoria": "Organização (pandas)", "oque": "Renumera as linhas e transforma o índice antigo em coluna comum.", "exemplo": "df.groupby(\"Região\")[\"Valor_Venda\"].sum().reset_index()", "quando": "depois de groupby, para voltar a ter uma tabela normal.", "grupo": "Bibliotecas"}, {"codigo": "class", "categoria": "Orientação a Objetos", "oque": "Define uma classe (um molde para criar objetos).", "exemplo": "class Carro: pass", "quando": "Um molde: como a forma de biscoito, que gera vários biscoitos iguais.", "grupo": "Python"}, {"codigo": "classmethod", "categoria": "Orientação a Objetos", "oque": "Transforma um método em método da classe, não de um objeto específico.", "exemplo": "@classmethod def meu_metodo(cls): pass", "quando": "Uma função do molde, e não de um biscoito só.", "grupo": "Python"}, {"codigo": "delattr", "categoria": "Orientação a Objetos", "oque": "Apaga um atributo de um objeto.", "exemplo": "delattr(obj, 'attr')", "quando": "Tira uma característica do objeto.", "grupo": "Python"}, {"codigo": "getattr", "categoria": "Orientação a Objetos", "oque": "Lê o valor de um atributo de um objeto.", "exemplo": "getattr(obj, 'nome', 'default')", "quando": "Pergunta: \"qual é o nome desse objeto?\" (com um valor padrão, caso não exista).", "grupo": "Python"}, {"codigo": "hasattr", "categoria": "Orientação a Objetos", "oque": "Verifica se o objeto possui um atributo.", "exemplo": "hasattr(obj, 'nome')", "quando": "Pergunta: \"esse objeto tem esta característica?\".", "grupo": "Python"}, {"codigo": "object", "categoria": "Orientação a Objetos", "oque": "A raiz de todas as classes.", "exemplo": "obj = object()", "quando": "O ponto de partida de tudo na linguagem.", "grupo": "Python"}, {"codigo": "property", "categoria": "Orientação a Objetos", "oque": "Faz um método ser lido como se fosse um atributo comum.", "exemplo": "@property def x(self): return self._x", "quando": "Permite usar algo como se fosse um dado comum.", "grupo": "Python"}, {"codigo": "setattr", "categoria": "Orientação a Objetos", "oque": "Define o valor de um atributo de um objeto.", "exemplo": "setattr(obj, 'nome', 'Ana')", "quando": "Coloca um valor numa característica do objeto.", "grupo": "Python"}, {"codigo": "staticmethod", "categoria": "Orientação a Objetos", "oque": "Transforma um método em método estático (não depende de objeto nem da classe).", "exemplo": "@staticmethod def estatico(): pass", "quando": "Uma função que mora dentro da classe, mas não precisa de nada dela.", "grupo": "Python"}, {"codigo": "super", "categoria": "Orientação a Objetos", "oque": "Acessa a classe \"mãe\" de dentro da classe \"filha\".", "exemplo": "super().__init__()", "quando": "Permite à classe filha reaproveitar o que a mãe já faz.", "grupo": "Python"}, {"codigo": ".to_numpy()", "categoria": "Pandas (Conversão)", "oque": "Transforma uma coluna (Series) ou uma tabela do pandas em um array do NumPy.", "exemplo": "valor_venda = df[\"Valor_Venda\"].to_numpy()", "quando": "Quando quiser usar as funções do NumPy em uma coluna da tabela.", "grupo": "Bibliotecas"}, {"codigo": "iterrows", "categoria": "Pandas (DataFrame)", "oque": "Percorre uma tabela linha por linha.", "exemplo": "for i, linha in df.iterrows(): print(linha['Valor_Venda'])", "quando": "Lê a tabela uma linha de cada vez. Em tabelas grandes é lento; prefira operações que já trabalham com a coluna inteira.", "grupo": "Bibliotecas"}, {"codigo": "transform", "categoria": "Pandas: Agrupar e Calcular", "oque": "Calcula um valor por grupo e devolve um resultado para cada linha original.", "exemplo": "df['Média_Região'] = df.groupby('Região')['Valor_Venda'].transform('mean')", "quando": "Quando quer colocar a média do grupo em cada linha. Diferente do agg(), que devolve uma linha por grupo.", "grupo": "Bibliotecas"}, {"codigo": "apply", "categoria": "Pandas: Aplicar Funções", "oque": "Aplica uma função a cada valor de uma coluna, ou a cada linha de um DataFrame (com axis=1).", "exemplo": "df['Valor_Venda'].apply(lambda v: v * 1.1)", "quando": "Quando a regra é sua e o map() não resolve. Em linhas: df.apply(minha_funcao, axis=1).", "grupo": "Bibliotecas"}, {"codigo": "applymap", "categoria": "Pandas: Aplicar Funções", "oque": "Aplica uma função a todas as células do DataFrame. Nas versões novas do pandas, o nome é DataFrame.map().", "exemplo": "df.applymap(str.strip)", "quando": "Útil para limpar espaços em todo o texto da tabela de uma vez.", "grupo": "Bibliotecas"}, {"codigo": "rename", "categoria": "Pandas: Colunas", "oque": "Troca o nome de colunas.", "exemplo": "df.rename(columns={'Valor_Venda': 'Valor'})", "quando": "Deixar nomes de colunas mais curtos ou mais claros para o relatório.", "grupo": "Bibliotecas"}, {"codigo": "ignore_index", "categoria": "Pandas: Combinar Tabelas", "oque": "Parâmetro que recria a numeração das linhas depois de juntar tabelas.", "exemplo": "pd.concat([a, b], ignore_index=True)", "quando": "Evita números de linha repetidos (0, 1, 2, 0, 1...) depois de empilhar.", "grupo": "Bibliotecas"}, {"codigo": "join", "categoria": "Pandas: Combinar Tabelas", "oque": "Junta duas tabelas pelo índice (o número da linha).", "exemplo": "df1.join(df2, how='left')", "quando": "Quando as duas tabelas têm o mesmo índice. Para juntar por uma coluna, use merge().", "grupo": "Bibliotecas"}, {"codigo": "pd.concat", "categoria": "Pandas: Combinar Tabelas", "oque": "Empilha tabelas, uma embaixo da outra (ou lado a lado).", "exemplo": "pd.concat([vendas_jan, vendas_fev])", "quando": "Quando as tabelas têm as mesmas colunas, como arquivos de meses diferentes.", "grupo": "Bibliotecas"}, {"codigo": "copy", "categoria": "Pandas: Cópias", "oque": "Cria uma cópia independente do DataFrame.", "exemplo": "df2 = df.copy()", "quando": "Sem o copy(), df2 = df faz as duas variáveis apontarem para os mesmos dados: mudar uma muda a outra.", "grupo": "Bibliotecas"}, {"codigo": "dt.day_name", "categoria": "Pandas: Datas", "oque": "Devolve o nome do dia da semana de uma coluna de datas (em inglês).", "exemplo": "df['Data'].dt.day_name()", "quando": "Descobrir em quais dias da semana as vendas são maiores.", "grupo": "Bibliotecas"}, {"codigo": "dt.month", "categoria": "Pandas: Datas", "oque": "Extrai o número do mês de uma coluna de datas.", "exemplo": "df['Data'].dt.month", "quando": "Agrupar vendas por mês. Use .dt.year para o ano e .dt.day para o dia.", "grupo": "Bibliotecas"}, {"codigo": "drop_duplicates", "categoria": "Pandas: Duplicatas", "oque": "Remove as linhas repetidas e devolve a tabela sem cópias.", "exemplo": "df.drop_duplicates(subset=['Pedido'], keep='first')", "quando": "Depois de confirmar com duplicated(). Com keep='first' fica a primeira ocorrência.", "grupo": "Bibliotecas"}, {"codigo": "duplicated", "categoria": "Pandas: Duplicatas", "oque": "Marca com True as linhas que já apareceram antes (cópias). Não remove nada.", "exemplo": "df.duplicated().sum()", "quando": "Conta quantas linhas repetidas existem, antes de decidir apagar.", "grupo": "Bibliotecas"}, {"codigo": "clip", "categoria": "Pandas: Estatística", "oque": "Limita os valores a um mínimo e a um máximo, sem apagar a linha.", "exemplo": "df['Valor_Venda'].clip(lower=500, upper=5000)", "quando": "Valores abaixo de 500 viram 500 e acima de 5000 viram 5000. Um jeito de tratar outliers sem perder o registro.", "grupo": "Bibliotecas"}, {"codigo": "IQR", "categoria": "Pandas: Estatística", "oque": "Amplitude interquartil: a diferença entre Q3 (75%) e Q1 (25%).", "exemplo": "iqr = q3 - q1", "quando": "Mostra a faixa onde ficam os 50% do meio dos dados. Usada para achar outliers.", "grupo": "Bibliotecas"}, {"codigo": "median", "categoria": "Pandas: Estatística", "oque": "Mediana: o valor do meio quando os dados estão em ordem.", "exemplo": "df['Valor_Venda'].median()", "quando": "Menos afetada por valores extremos do que a média. Bom resumo para vendas e preços.", "grupo": "Bibliotecas"}, {"codigo": "mode", "categoria": "Pandas: Estatística", "oque": "Devolve o valor que mais aparece na coluna (a moda).", "exemplo": "df['Canal'].mode()", "quando": "Descobre a categoria mais comum, por exemplo o canal que mais vende.", "grupo": "Bibliotecas"}, {"codigo": "quantile", "categoria": "Pandas: Estatística", "oque": "Devolve o valor abaixo do qual fica uma porcentagem dos dados.", "exemplo": "df['Valor_Venda'].quantile(0.25)", "quando": "O 0.25 é o Q1: 25% dos valores ficam abaixo desse número. É a base da regra do IQR.", "grupo": "Bibliotecas"}, {"codigo": "std", "categoria": "Pandas: Estatística", "oque": "Desvio padrão: o quanto os valores se afastam, em média, da média.", "exemplo": "df['Valor_Venda'].std()", "quando": "Quanto maior o número, mais espalhados estão os dados. É a base do Z-score.", "grupo": "Bibliotecas"}, {"codigo": "pd.cut", "categoria": "Pandas: Faixas", "oque": "Divide os valores em faixas com limites que você define (ou em faixas de mesma largura).", "exemplo": "pd.cut(df['Valor_Venda'], bins=3)", "quando": "Quando os limites têm sentido de negócio, como 0 a 1000 e 1000 a 2000.", "grupo": "Bibliotecas"}, {"codigo": "pd.qcut", "categoria": "Pandas: Faixas", "oque": "Divide os valores em grupos com a mesma quantidade de linhas (quantis).", "exemplo": "pd.qcut(df['Valor_Venda'], q=4)", "quando": "Com q=4, cada grupo fica com cerca de 25% dos registros. Bom para comparar grupos de tamanho igual.", "grupo": "Bibliotecas"}, {"codigo": "MinMaxScaler", "categoria": "Pandas: Normalização (scikit-learn)", "oque": "Escala os valores para o intervalo de 0 a 1.", "exemplo": "MinMaxScaler().fit_transform(df[['Valor_Venda']])", "quando": "Quando precisa que todos os números fiquem entre 0 e 1. Sensível a outliers.", "grupo": "Bibliotecas"}, {"codigo": "RobustScaler", "categoria": "Pandas: Normalização (scikit-learn)", "oque": "Escala usando a mediana e o IQR, sem se deixar levar pelos outliers.", "exemplo": "RobustScaler().fit_transform(df[['Valor_Venda']])", "quando": "Quando a coluna tem muitos valores extremos.", "grupo": "Bibliotecas"}, {"codigo": "StandardScaler", "categoria": "Pandas: Normalização (scikit-learn)", "oque": "Padroniza os valores: média 0 e desvio padrão 1 (Z-score).", "exemplo": "StandardScaler().fit_transform(df[['Valor_Venda']])", "quando": "Quando os dados são parecidos com uma curva em sino e você quer comparar colunas de escalas diferentes.", "grupo": "Bibliotecas"}, {"codigo": "sort_values", "categoria": "Pandas: Ordenação", "oque": "Ordena a tabela pelos valores de uma ou mais colunas.", "exemplo": "df.sort_values('Valor_Venda', ascending=False)", "quando": "Ver os maiores valores primeiro. ascending=False inverte a ordem.", "grupo": "Bibliotecas"}, {"codigo": "bfill", "categoria": "Pandas: Valores Ausentes", "oque": "Preenche o vazio com o valor da linha de baixo.", "exemplo": "df['Região'].bfill()", "quando": "O mesmo que o ffill, mas copiando de baixo para cima.", "grupo": "Bibliotecas"}, {"codigo": "dropna", "categoria": "Pandas: Valores Ausentes", "oque": "Remove as linhas (ou colunas) que têm algum valor vazio.", "exemplo": "df.dropna()", "quando": "Quando as linhas com falha não fazem falta. Cuidado: pode apagar muitos dados de uma vez.", "grupo": "Bibliotecas"}, {"codigo": "ffill", "categoria": "Pandas: Valores Ausentes", "oque": "Preenche o vazio com o valor da linha de cima.", "exemplo": "df['Região'].ffill()", "quando": "Útil quando a planilha mostra o nome só na primeira linha de cada grupo.", "grupo": "Bibliotecas"}, {"codigo": "fillna", "categoria": "Pandas: Valores Ausentes", "oque": "Preenche os valores vazios com um valor escolhido.", "exemplo": "df['Valor_Venda'].fillna(0)", "quando": "Troca o vazio por 0, por uma média ou por um texto como 'Não informado'. Mantém a linha.", "grupo": "Bibliotecas"}, {"codigo": "isnull", "categoria": "Pandas: Valores Ausentes", "oque": "Marca com True as células vazias (valores faltando).", "exemplo": "df.isnull().sum()", "quando": "Primeiro passo de qualquer limpeza: descobrir onde faltam dados. O .sum() conta quantos há em cada coluna.", "grupo": "Bibliotecas"}, {"codigo": "reset_index", "categoria": "Pandas: Índice", "oque": "Volta o índice para números (0, 1, 2...) e transforma o índice atual em coluna.", "exemplo": "df.reset_index()", "quando": "Depois de um groupby ou set_index, quando quer a tabela de volta no formato comum.", "grupo": "Bibliotecas"}, {"codigo": "set_index", "categoria": "Pandas: Índice", "oque": "Transforma uma coluna em índice (o nome de cada linha).", "exemplo": "df.set_index('Pedido')", "quando": "Quando um identificador, como o número do pedido, deve ser a referência de cada linha.", "grupo": "Bibliotecas"}, {"codigo": "keep", "categoria": "Parâmetro (drop_duplicates)", "oque": "Define qual repetição manter: \"first\", \"last\" ou False para remover todas.", "exemplo": "df.drop_duplicates(keep=\"first\")", "quando": "para escolher qual registro guardar entre os repetidos.", "grupo": "Bibliotecas"}, {"codigo": "subset", "categoria": "Parâmetro (drop_duplicates, dropna)", "oque": "Define só algumas colunas para checar repetição ou vazios.", "exemplo": "df.drop_duplicates(subset=[\"Data\", \"Região\"])", "quando": "quando duas linhas só são repetidas se algumas colunas coincidirem.", "grupo": "Bibliotecas"}, {"codigo": "ensure_ascii=", "categoria": "Parâmetro (json.dumps)", "oque": "Mesmo efeito do force_ascii, no módulo json.", "exemplo": "json.dumps(dados, ensure_ascii=False)", "quando": "para mostrar acentos corretamente no texto JSON.", "grupo": "Python"}, {"codigo": "how", "categoria": "Parâmetro (merge)", "oque": "Tipo de junção: inner, left, right ou outer.", "exemplo": "df.merge(metas, on=\"Região\", how=\"left\")", "quando": "left mantém todas as linhas da tabela da esquerda; inner mantém só as que combinam nas duas.", "grupo": "Bibliotecas"}, {"codigo": "left_on", "categoria": "Parâmetro (merge)", "oque": "Nome da coluna-chave na tabela da esquerda, quando o nome é diferente.", "exemplo": "df.merge(metas, left_on=\"Regiao\", right_on=\"Região\")", "quando": "quando a mesma informação tem nomes diferentes nas duas tabelas.", "grupo": "Bibliotecas"}, {"codigo": "on", "categoria": "Parâmetro (merge)", "oque": "Nome da coluna em comum usada para juntar as tabelas.", "exemplo": "df.merge(metas, on=\"Região\")", "quando": "quando as duas tabelas têm a mesma coluna-chave.", "grupo": "Bibliotecas"}, {"codigo": "right_on", "categoria": "Parâmetro (merge)", "oque": "Nome da coluna-chave na tabela da direita, quando o nome é diferente.", "exemplo": "df.merge(metas, left_on=\"Regiao\", right_on=\"Região\")", "quando": "junto com left_on, nas junções com nomes diferentes.", "grupo": "Bibliotecas"}, {"codigo": "ddof", "categoria": "Parâmetro (np.std)", "oque": "Define o divisor do desvio padrão. Com 0 (padrão do NumPy) calcula o populacional; com 1 calcula o amostral, que é o padrão do pandas.", "exemplo": "valores.std(ddof=1)", "quando": "Quando o NumPy e o pandas derem resultados diferentes para o desvio padrão.", "grupo": "Bibliotecas"}, {"codigo": "axis", "categoria": "Parâmetro (NumPy e Pandas)", "oque": "Direção do cálculo: axis=0 vai por coluna; axis=1 vai por linha.", "exemplo": "m.mean(axis=0)", "quando": "para calcular médias de cada coluna de uma matriz.", "grupo": "Bibliotecas"}, {"codigo": "bins", "categoria": "Parâmetro (pd.cut)", "oque": "Os limites das faixas.", "exemplo": "pd.cut(df[\"Valor_Venda\"], bins=[0, 500, 2000])", "quando": "junto com pd.cut, para definir onde começa e termina cada faixa.", "grupo": "Bibliotecas"}, {"codigo": "labels", "categoria": "Parâmetro (pd.cut)", "oque": "Os nomes das faixas criadas.", "exemplo": "pd.cut(df[\"Valor_Venda\"], bins=[0, 500, 2000], labels=[\"Baixa\", \"Alta\"])", "quando": "para dar nomes legíveis às faixas.", "grupo": "Bibliotecas"}, {"codigo": "aggfunc", "categoria": "Parâmetro (pivot_table)", "oque": "Função usada para resumir os valores: sum, mean, count, entre outras.", "exemplo": "pd.pivot_table(df, aggfunc=\"mean\", ...)", "quando": "sempre que a tabela cruzada precisar de soma, média ou contagem.", "grupo": "Bibliotecas"}, {"codigo": "columns (pivot_table)", "categoria": "Parâmetro (pivot_table)", "oque": "Coluna que vai nas colunas da tabela cruzada.", "exemplo": "pd.pivot_table(df, columns=\"Canal\", ...)", "quando": "para escolher a categoria das colunas.", "grupo": "Bibliotecas"}, {"codigo": "index (pivot_table)", "categoria": "Parâmetro (pivot_table)", "oque": "Coluna que vai nas linhas da tabela cruzada.", "exemplo": "pd.pivot_table(df, index=\"Região\", ...)", "quando": "para escolher a categoria das linhas.", "grupo": "Bibliotecas"}, {"codigo": "values (pivot_table)", "categoria": "Parâmetro (pivot_table)", "oque": "Coluna cujos valores serão resumidos.", "exemplo": "pd.pivot_table(df, values=\"Valor_Venda\", ...)", "quando": "para indicar qual número será somado ou contado.", "grupo": "Bibliotecas"}, {"codigo": "drop= (reset_index)", "categoria": "Parâmetro (reset_index)", "oque": "Se True, descarta o índice antigo em vez de guardá-lo como coluna.", "exemplo": "df.reset_index(drop=True)", "quando": "depois de filtrar, para as linhas voltarem a ser 0, 1, 2...", "grupo": "Bibliotecas"}, {"codigo": "random_state", "categoria": "Parâmetro (sample)", "oque": "Número que fixa o sorteio aleatório.", "exemplo": "df.sample(5, random_state=42)", "quando": "para o sorteio dar sempre o mesmo resultado.", "grupo": "Bibliotecas"}, {"codigo": "ascending", "categoria": "Parâmetro (sort_values)", "oque": "Define se a ordem é crescente (True) ou decrescente (False).", "exemplo": "df.sort_values(\"Valor_Venda\", ascending=False)", "quando": "para colocar o maior valor no topo.", "grupo": "Bibliotecas"}, {"codigo": "reverse=True", "categoria": "Parâmetro (sorted, sort)", "oque": "Inverte a ordem, do maior para o menor.", "exemplo": "sorted([3, 1, 2], reverse=True)", "quando": "para ordenar do maior para o menor.", "grupo": "Bibliotecas"}, {"codigo": "case= (str.contains)", "categoria": "Parâmetro (str.contains)", "oque": "Se False, ignora maiúsculas e minúsculas na busca.", "exemplo": "df[\"Produto\"].str.contains(\"paçoca\", case=False)", "quando": "quando não sabe se o texto está com inicial maiúscula.", "grupo": "Bibliotecas"}, {"codigo": "index=False", "categoria": "Parâmetro (to_csv, to_excel)", "oque": "Não salva a numeração das linhas no arquivo.", "exemplo": "df.to_csv(\"resultado.csv\", index=False)", "quando": "quase sempre, para o arquivo não ganhar uma coluna extra de números.", "grupo": "Bibliotecas"}, {"codigo": "dayfirst", "categoria": "Parâmetro (to_datetime)", "oque": "Indica que o dia vem antes do mês (padrão brasileiro: 05/10/2026).", "exemplo": "pd.to_datetime(df[\"Data\"], dayfirst=True)", "quando": "sempre que as datas estiverem no formato dia/mês/ano.", "grupo": "Bibliotecas"}, {"codigo": "format= (to_datetime)", "categoria": "Parâmetro (to_datetime)", "oque": "Diz ao pandas como a data está escrita no texto.", "exemplo": "pd.to_datetime(df[\"Data\"], format=\"%d%m%Y\")", "quando": "quando as datas vêm sem separadores, como 21122020.", "grupo": "Bibliotecas"}, {"codigo": "force_ascii=", "categoria": "Parâmetro (to_json)", "oque": "Se False, mantém acentos e cedilha no arquivo.", "exemplo": "df.to_json(\"vendas.json\", force_ascii=False)", "quando": "quando os dados têm acentos em português.", "grupo": "Bibliotecas"}, {"codigo": "indent=", "categoria": "Parâmetro (to_json, json.dumps)", "oque": "Recua as linhas do JSON para ficar fácil de ler.", "exemplo": "df.to_json(\"vendas.json\", indent=2)", "quando": "quando alguém vai abrir o arquivo para ler.", "grupo": "Bibliotecas"}, {"codigo": "orient", "categoria": "Parâmetro (to_json, read_json)", "oque": "Define a estrutura do JSON. \"records\" gera uma lista de registros.", "exemplo": "df.to_json(\"vendas.json\", orient=\"records\")", "quando": "para exportar uma tabela como lista de linhas.", "grupo": "Bibliotecas"}, {"codigo": "errors", "categoria": "Parâmetro (to_numeric, to_datetime)", "oque": "Define o que fazer com valores que não convertem: \"raise\", \"coerce\" ou \"ignore\".", "exemplo": "pd.to_numeric(df[\"Valor\"], errors=\"coerce\")", "quando": "com \"coerce\", o valor inválido vira vazio em vez de parar o programa.", "grupo": "Bibliotecas"}, {"codigo": "inplace", "categoria": "Parâmetro (vários métodos)", "oque": "Se True, altera a própria tabela; se False (padrão), devolve uma cópia alterada.", "exemplo": "df.drop(columns=[\"Canal\"], inplace=True)", "quando": "com cuidado; é mais seguro guardar o resultado numa nova variável.", "grupo": "Bibliotecas"}, {"codigo": "decimal", "categoria": "Parâmetro de Leitura", "oque": "Define qual caractere é o separador decimal.", "exemplo": "pd.read_csv(\"vendas.csv\", decimal=\",\")", "quando": "em números no padrão brasileiro, como 1234,56.", "grupo": "Bibliotecas"}, {"codigo": "dtype", "categoria": "Parâmetro de Leitura", "oque": "Define o tipo de uma ou mais colunas na leitura.", "exemplo": "pd.read_csv(\"vendas.csv\", dtype={\"Código\": str})", "quando": "para códigos que começam com zero (ex.: 00123), que sem isso perdem o zero.", "grupo": "Bibliotecas"}, {"codigo": "encoding", "categoria": "Parâmetro de Leitura", "oque": "Define como os caracteres são lidos (acentos e cedilha).", "exemplo": "pd.read_csv(\"vendas.csv\", encoding=\"utf-8\")", "quando": "se aparecerem letras estranhas no lugar de acentos, tente \"utf-8\" ou \"latin-1\".", "grupo": "Bibliotecas"}, {"codigo": "header", "categoria": "Parâmetro de Leitura", "oque": "Indica qual linha contém os nomes das colunas.", "exemplo": "pd.read_excel(\"vendas.xlsx\", header=2)", "quando": "quando a planilha tem título ou linhas vazias antes da tabela.", "grupo": "Bibliotecas"}, {"codigo": "index_col", "categoria": "Parâmetro de Leitura", "oque": "Usa uma coluna como nome das linhas logo na leitura.", "exemplo": "pd.read_csv(\"vendas.csv\", index_col=\"Data\")", "quando": "quando uma coluna identifica bem cada linha.", "grupo": "Bibliotecas"}, {"codigo": "na_values", "categoria": "Parâmetro de Leitura", "oque": "Diz quais textos devem ser tratados como valor vazio.", "exemplo": "pd.read_csv(\"vendas.csv\", na_values=[\"-\", \"N/A\"])", "quando": "quando a planilha usa traços ou outras marcas no lugar de célula vazia.", "grupo": "Bibliotecas"}, {"codigo": "names", "categoria": "Parâmetro de Leitura", "oque": "Dá nomes às colunas quando o arquivo não tem cabeçalho.", "exemplo": "pd.read_csv(\"vendas.csv\", names=[\"Data\", \"Região\", \"Valor\"])", "quando": "quando o arquivo vem sem a linha de títulos.", "grupo": "Bibliotecas"}, {"codigo": "nrows", "categoria": "Parâmetro de Leitura", "oque": "Lê apenas as primeiras linhas do arquivo.", "exemplo": "pd.read_csv(\"vendas.csv\", nrows=100)", "quando": "para testar com um arquivo grande sem carregar tudo.", "grupo": "Bibliotecas"}, {"codigo": "parse_dates", "categoria": "Parâmetro de Leitura", "oque": "Faz o Python reconhecer colunas de data como data de verdade.", "exemplo": "pd.read_csv(\"vendas.csv\", parse_dates=[\"Data\"])", "quando": "sempre que a coluna de data vier como texto, para poder filtrar por ano e mês.", "grupo": "Bibliotecas"}, {"codigo": "sep", "categoria": "Parâmetro de Leitura", "oque": "Caractere que separa as colunas no arquivo (vírgula, ponto e vírgula, tabulação).", "exemplo": "pd.read_csv(\"vendas.csv\", sep=\";\")", "quando": "se o CSV abrir com todos os dados numa coluna só, o sep provavelmente está errado.", "grupo": "Bibliotecas"}, {"codigo": "sheet_name", "categoria": "Parâmetro de Leitura", "oque": "Escolhe a aba da planilha Excel pelo nome ou posição. Com None, lê todas.", "exemplo": "pd.read_excel(\"vendas.xlsx\", sheet_name=\"Janeiro\")", "quando": "quando a planilha tem várias abas e você quer uma específica (ou todas, com sheet_name=None).", "grupo": "Bibliotecas"}, {"codigo": "skiprows", "categoria": "Parâmetro de Leitura", "oque": "Pula um número de linhas no começo do arquivo.", "exemplo": "pd.read_csv(\"vendas.csv\", skiprows=3)", "quando": "para ignorar observações ou títulos antes dos dados.", "grupo": "Bibliotecas"}, {"codigo": "thousands", "categoria": "Parâmetro de Leitura", "oque": "Define qual caractere separa milhares.", "exemplo": "pd.read_csv(\"vendas.csv\", thousands=\".\")", "quando": "quando números aparecem como 1.500 e precisam virar 1500.", "grupo": "Bibliotecas"}, {"codigo": "usecols", "categoria": "Parâmetro de Leitura", "oque": "Carrega apenas as colunas escolhidas.", "exemplo": "pd.read_csv(\"vendas.csv\", usecols=[\"Produto\", \"Valor_Venda\"])", "quando": "para deixar o arquivo mais leve quando só algumas colunas interessam.", "grupo": "Bibliotecas"}, {"codigo": "async", "categoria": "Programação Assíncrona", "oque": "Define uma função que pode esperar sem travar o programa.", "exemplo": "async def busca(): return 1", "quando": "Permite fazer tarefas que demoram sem parar o restante do programa.", "grupo": "Python"}, {"codigo": "await", "categoria": "Programação Assíncrona", "oque": "Espera o resultado de uma tarefa assíncrona.", "exemplo": "resultado = await busca()", "quando": "\"Espera aqui, mas deixa o programa seguir com outras coisas\".", "grupo": "Python"}, {"codigo": ".keys()", "categoria": "Python (Dicionários)", "oque": "Lista as chaves de um dicionário.", "exemplo": "agenda.keys()", "quando": "para ver os nomes que existem no dicionário.", "grupo": "Python"}, {"codigo": ".values()", "categoria": "Python (Dicionários)", "oque": "Lista os valores de um dicionário.", "exemplo": "agenda.values()", "quando": "para ver só os valores guardados.", "grupo": "Python"}, {"codigo": "Lista por compreensão", "categoria": "Python (Estruturas)", "oque": "Cria uma lista em uma linha, aplicando uma regra a cada item.", "exemplo": "[x * 2 for x in lista]", "quando": "para transformar uma lista de forma curta.", "grupo": "Python"}, {"codigo": "key= (sorted)", "categoria": "Python (Funções)", "oque": "Diz pelo que a lista será ordenada.", "exemplo": "sorted(vendas, key=lambda v: v[1])", "quando": "para ordenar tuplas ou dicionários por um dos campos.", "grupo": "Python"}, {"codigo": ".append()", "categoria": "Python (Listas)", "oque": "Adiciona um item no fim da lista.", "exemplo": "lista.append(5)", "quando": "para ir juntando itens numa lista durante um laço.", "grupo": "Python"}, {"codigo": ".extend()", "categoria": "Python (Listas)", "oque": "Adiciona vários itens de uma vez no fim da lista.", "exemplo": "lista.extend([6, 7])", "quando": "para juntar outra lista à atual.", "grupo": "Python"}, {"codigo": ".pop()", "categoria": "Python (Listas)", "oque": "Remove e devolve um item (por padrão, o último).", "exemplo": "lista.pop()", "quando": "para tirar um item da lista e usá-lo.", "grupo": "Python"}, {"codigo": ".join() (texto)", "categoria": "Python (Texto)", "oque": "Junta uma lista de textos usando um separador.", "exemplo": "\", \".join([\"Blumenau\", \"Joinville\"])", "quando": "para montar uma lista em uma frase.", "grupo": "Python"}, {"codigo": "f-string", "categoria": "Python (Texto)", "oque": "Texto com variáveis dentro de chaves, marcado com f antes das aspas.", "exemplo": "f\"Total: {total}\"", "quando": "para mostrar resultados numa frase legível.", "grupo": "Python"}, {"codigo": "Formatação de número", "categoria": "Python (Texto)", "oque": "Formata o número com separador de milhar e casas decimais.", "exemplo": "f\"R$ {total:,.2f}\"", "quando": "para mostrar valores em dinheiro.", "grupo": "Python"}, {"codigo": ".melt()", "categoria": "Reorganização (Pandas)", "oque": "Transforma colunas em linhas (tabela larga vira tabela longa).", "exemplo": "df.melt(id_vars=\"Região\")", "quando": "quando meses ou anos estão como colunas e você quer tê-los como linhas.", "grupo": "Bibliotecas"}, {"codigo": "Indexação 2D (NumPy)", "categoria": "Seleção (NumPy)", "oque": "Acessa uma célula de uma matriz com [linha, coluna].", "exemplo": "matriz[1, 2]", "quando": "para pegar um valor específico de uma tabela numérica.", "grupo": "Bibliotecas"}, {"codigo": "Indexação booleana (NumPy)", "categoria": "Seleção (NumPy)", "oque": "Usa uma condição dentro dos colchetes para escolher valores do array.", "exemplo": "valores[valores > 300]", "quando": "para filtrar valores de um array.", "grupo": "Bibliotecas"}, {"codigo": "Índice por lista (NumPy)", "categoria": "Seleção (NumPy)", "oque": "Pega várias posições escolhidas de uma vez.", "exemplo": "v[[1, 3]]", "quando": "para escolher algumas posições específicas.", "grupo": "Bibliotecas"}, {"codigo": "Fatiamento (slice)", "categoria": "Seleção (Python e NumPy)", "oque": "Pega um trecho de uma lista ou array. O último índice do intervalo não entra.", "exemplo": "valores[2:5]", "quando": "para pegar um intervalo de itens.", "grupo": "Bibliotecas"}, {"codigo": "[-1] (índice negativo)", "categoria": "Seleção (Python)", "oque": "Posição negativa conta a partir do fim: -1 é o último item.", "exemplo": "valores[-1]", "quando": "para pegar o último registro sem precisar saber o tamanho da lista.", "grupo": "Python"}, {"codigo": ".at[]", "categoria": "Seleção e Filtro (Pandas)", "oque": "Lê uma única célula pelo nome da linha e da coluna.", "exemplo": "df.at[0, \"Valor_Venda\"]", "quando": "para consultar um valor específico de forma rápida.", "grupo": "Bibliotecas"}, {"codigo": ".between()", "categoria": "Seleção e Filtro (Pandas)", "oque": "Verifica se o valor está entre dois limites, incluindo os extremos.", "exemplo": "df[\"Valor_Venda\"].between(1500, 2600)", "quando": "para filtrar faixas de valores, como vendas entre R$ 1.500 e R$ 2.600.", "grupo": "Bibliotecas"}, {"codigo": ".iat[]", "categoria": "Seleção e Filtro (Pandas)", "oque": "Lê uma única célula pela posição.", "exemplo": "df.iat[0, 4]", "quando": "para consultar uma célula pela posição numérica.", "grupo": "Bibliotecas"}, {"codigo": ".iloc[]", "categoria": "Seleção e Filtro (Pandas)", "oque": "Seleciona linhas e colunas pela POSIÇÃO (0, 1, 2...). O último valor do intervalo não entra.", "exemplo": "df.iloc[0:4, 1:5]", "quando": "quando quer pegar as primeiras linhas, as últimas ou uma posição específica.", "grupo": "Bibliotecas"}, {"codigo": ".isin()", "categoria": "Seleção e Filtro (Pandas)", "oque": "Verifica se o valor está dentro de uma lista de opções.", "exemplo": "df[df[\"Região\"].isin([\"Joinville\", \"Blumenau\"])]", "quando": "quando quer várias opções de uma vez, em vez de vários \"ou\".", "grupo": "Bibliotecas"}, {"codigo": ".loc[]", "categoria": "Seleção e Filtro (Pandas)", "oque": "Seleciona linhas e colunas pelo NOME. O último valor de um intervalo é incluído.", "exemplo": "df.loc[0:4, [\"Região\", \"Valor_Venda\"]]", "quando": "quando você conhece os nomes das colunas e quer pegar partes da tabela.", "grupo": "Bibliotecas"}, {"codigo": ".query()", "categoria": "Seleção e Filtro (Pandas)", "oque": "Filtra escrevendo a condição como texto, quase como uma frase.", "exemplo": "df.query(\"Canal == 'E-Commerce' and Valor_Venda > 2000\")", "quando": "para filtros mais legíveis, sem tantos colchetes e parênteses.", "grupo": "Bibliotecas"}, {"codigo": "@variável no query", "categoria": "Seleção e Filtro (Pandas)", "oque": "Usa uma variável do Python dentro do query, com o símbolo @.", "exemplo": "df.query(\"Valor_Venda > @limite\")", "quando": "quando o valor de comparação já está guardado numa variável.", "grupo": "Bibliotecas"}, {"codigo": "df[\"coluna\"]", "categoria": "Seleção e Filtro (Pandas)", "oque": "Pega uma coluna inteira (vira uma Series).", "exemplo": "df[\"Valor_Venda\"]", "quando": "sempre que for fazer cálculo ou filtro em uma coluna só.", "grupo": "Bibliotecas"}, {"codigo": "df[[\"col1\", \"col2\"]]", "categoria": "Seleção e Filtro (Pandas)", "oque": "Pega várias colunas ao mesmo tempo (note os dois pares de colchetes).", "exemplo": "df[[\"Produto\", \"Valor_Venda\"]]", "quando": "para escolher algumas colunas para trabalhar.", "grupo": "Bibliotecas"}, {"codigo": "_ em números", "categoria": "Sintaxe (Python)", "oque": "Usa o underline como separador visual em números grandes. O Python ignora.", "exemplo": "n = 1_000_000", "quando": "para deixar números grandes mais fáceis de ler.", "grupo": "Python"}, {"codigo": "Git Bash", "categoria": "Terminal – Ferramentas", "oque": "Terminal que simula o Linux no Windows. É onde você digita os comandos do Git.", "exemplo": "git --version no Git Bash", "quando": "Ao instalar e usar Git no Windows.", "grupo": "Terminal"}, {"codigo": "cd", "categoria": "Terminal – Navegação", "oque": "Significa \"change directory\" (mudar de pasta). Entra em uma pasta.", "exemplo": "cd codigo", "quando": "Para entrar na pasta do projeto. Digite cada comando em sua própria linha.", "grupo": "Terminal"}, {"codigo": "cd ..", "categoria": "Terminal – Navegação", "oque": "Sobe uma pasta, voltando para a pasta de cima.", "exemplo": "cd ..", "quando": "Quando entrou na pasta errada.", "grupo": "Terminal"}, {"codigo": ".str.contains()", "categoria": "Texto (Pandas)", "oque": "Verifica se o texto contém uma palavra ou trecho.", "exemplo": "df[df[\"Produto\"].str.contains(\"Paçoca\")]", "quando": "para filtrar por parte de um texto.", "grupo": "Bibliotecas"}, {"codigo": ".str.lower()", "categoria": "Texto (Pandas)", "oque": "Deixa o texto todo em minúsculas.", "exemplo": "df[\"Canal\"].str.lower()", "quando": "para padronizar textos antes de comparar.", "grupo": "Bibliotecas"}, {"codigo": ".str.replace()", "categoria": "Texto (Pandas)", "oque": "Troca um trecho de texto por outro.", "exemplo": "df[\"Valor\"].str.replace(\"R$\", \"\", regex=False)", "quando": "para tirar símbolos antes de converter o texto em número.", "grupo": "Bibliotecas"}, {"codigo": ".str.split()", "categoria": "Texto (Pandas)", "oque": "Divide um texto em partes, usando um separador.", "exemplo": "df[\"Data_txt\"].str.split(\"-\")", "quando": "para separar um texto em pedaços, como ano, mês e dia.", "grupo": "Bibliotecas"}, {"codigo": ".str.strip()", "categoria": "Texto (Pandas)", "oque": "Remove espaços no início e no fim do texto.", "exemplo": "df[\"Região\"].str.strip()", "quando": "quando \"Joinville \" com espaço não bate com \"Joinville\".", "grupo": "Bibliotecas"}, {"codigo": ".str.title()", "categoria": "Texto (Pandas)", "oque": "Coloca a primeira letra de cada palavra em maiúscula.", "exemplo": "df[\"Região\"].str.title()", "quando": "para padronizar nomes de cidades e pessoas.", "grupo": "Bibliotecas"}, {"codigo": ".str.upper()", "categoria": "Texto (Pandas)", "oque": "Deixa o texto todo em maiúsculas.", "exemplo": "df[\"Produto\"].str.upper()", "quando": "para padronizar textos antes de comparar.", "grupo": "Bibliotecas"}, {"codigo": ".lower()", "categoria": "Texto (Python)", "oque": "Deixa o texto todo em minúsculas.", "exemplo": "\"Olá\".lower() # \"olá\"", "quando": "para comparar textos sem se preocupar com maiúsculas.", "grupo": "Python"}, {"codigo": ".upper()", "categoria": "Texto (Python)", "oque": "Deixa o texto todo em maiúsculas.", "exemplo": "\"Olá\".upper() # \"OLÁ\"", "quando": "para padronizar textos antes de comparar ou exibir.", "grupo": "Python"}, {"codigo": "\\n (quebra de linha)", "categoria": "Texto (Python)", "oque": "Cria uma quebra de linha dentro de um texto.", "exemplo": "print(\"Linha 1\\nLinha 2\")", "quando": "para separar seções na saída do programa.", "grupo": "Python"}, {"codigo": "r\"...\" (texto cru)", "categoria": "Texto (Python)", "oque": "As barras invertidas são lidas exatamente como estão. Útil para caminhos do Windows.", "exemplo": "r\"C:\\pasta\\arquivo.xlsx\"", "quando": "ao escrever caminhos de arquivo com barras invertidas.", "grupo": "Python"}, {"codigo": "Raw string em caminhos (conceito)", "categoria": "Texto (Python)", "oque": "Em caminhos com barras invertidas, use r\"...\" ou barras normais /.", "exemplo": "r\"C:\\Users\\vendas.xlsx\"", "quando": "sempre que um caminho de arquivo der erro por causa da barra invertida.", "grupo": "Python"}, {"codigo": "bytearray", "categoria": "Tipos de Dados", "oque": "Sequência de bytes que pode ser alterada.", "exemplo": "bytearray(3) # Retorna bytearray(b'\\x00\\x00\\x00')", "quando": "Dados brutos do computador, em bytes. Uso avançado.", "grupo": "Python"}, {"codigo": "bytes", "categoria": "Tipos de Dados", "oque": "Sequência de bytes que não pode ser alterada.", "exemplo": "bytes(3) # Retorna b'\\x00\\x00\\x00'", "quando": "Igual ao anterior, mas fixo. Uso avançado.", "grupo": "Python"}, {"codigo": "complex", "categoria": "Tipos de Dados", "oque": "Cria um número complexo (com parte imaginária).", "exemplo": "complex(2, 3) # Retorna (2+3j)", "quando": "Número de matemática avançada. Pode ignorar por enquanto.", "grupo": "Python"}, {"codigo": "dict", "categoria": "Tipos de Dados", "oque": "Cria um dicionário: pares de chave e valor.", "exemplo": "dict(a=1, b=2) # Retorna {'a': 1, 'b': 2}", "quando": "Como uma agenda: cada nome (chave) tem um telefone (valor).", "grupo": "Python"}, {"codigo": "float", "categoria": "Tipos de Dados", "oque": "Converte para número decimal (com vírgula).", "exemplo": "float('3.14') # Retorna 3.14", "quando": "Número quebrado, como 3,14.", "grupo": "Python"}, {"codigo": "frozenset", "categoria": "Tipos de Dados", "oque": "Cria um conjunto que não pode ser alterado.", "exemplo": "frozenset([1, 2])", "quando": "Um conjunto lacrado.", "grupo": "Python"}, {"codigo": "int", "categoria": "Tipos de Dados", "oque": "Converte para número inteiro (sem vírgula).", "exemplo": "int('10') # Retorna 10", "quando": "Transforma texto em número inteiro.", "grupo": "Python"}, {"codigo": "list", "categoria": "Tipos de Dados", "oque": "Cria uma lista: sequência de itens entre colchetes.", "exemplo": "list((1, 2)) # Retorna [1, 2]", "quando": "Uma lista de compras: itens em ordem.", "grupo": "Python"}, {"codigo": "memoryview", "categoria": "Tipos de Dados", "oque": "Cria uma visualização de dados na memória.", "exemplo": "memoryview(b'abc')", "quando": "Olha um pedaço de dados sem copiar. Uso avançado.", "grupo": "Python"}, {"codigo": "set", "categoria": "Tipos de Dados", "oque": "Cria um conjunto: sem repetição e sem ordem.", "exemplo": "set([1, 2, 2]) # Retorna {1, 2}", "quando": "Remove repetidos automaticamente.", "grupo": "Python"}, {"codigo": "slice", "categoria": "Tipos de Dados", "oque": "Cria um recorte de uma sequência.", "exemplo": "s = slice(1, 4)", "quando": "Um recorte de parte da lista.", "grupo": "Python"}, {"codigo": "str", "categoria": "Tipos de Dados", "oque": "Converte para texto.", "exemplo": "str(123) # Retorna '123'", "quando": "Transforma algo em texto.", "grupo": "Python"}, {"codigo": "tuple", "categoria": "Tipos de Dados", "oque": "Cria uma tupla: lista que não pode ser alterada.", "exemplo": "tuple([1, 2]) # Retorna (1, 2)", "quando": "Uma lista lacrada, entre parênteses.", "grupo": "Python"}, {"codigo": ".apply()", "categoria": "Transformação (Pandas)", "oque": "Aplica uma função a cada valor ou a cada linha.", "exemplo": "df[\"Valor_Venda\"].apply(lambda x: x * 1.1)", "quando": "quando a conta é específica e não existe um método pronto.", "grupo": "Bibliotecas"}, {"codigo": ".assign()", "categoria": "Transformação (Pandas)", "oque": "Cria uma coluna nova sem alterar a tabela original.", "exemplo": "df.assign(Comissao=df[\"Valor_Venda\"] * 0.05)", "quando": "para criar colunas calculadas de forma organizada.", "grupo": "Bibliotecas"}, {"codigo": ".map()", "categoria": "Transformação (Pandas)", "oque": "Troca valores usando um dicionário ou uma função.", "exemplo": "df[\"Canal\"].map({\"E const AREAS = [
  { id: 'Python',  titulo: 'Python',  desc: 'Comandos básicos da linguagem' },
  { id: 'Bibliotecas', titulo: 'Bibliotecas (Pandas e NumPy)', desc: 'Tabelas, leitura de arquivos, análise e cálculos com arrays' },
  { id: 'Git',     titulo: 'Git e GitHub', desc: 'Controle de versão e envio ao GitHub' },
  { id: 'Terminal',titulo: 'Terminal',desc: 'Comandos digitados no Git Bash' },
  { id: 'Comp',    titulo: 'Comparativos', desc: 'Lado a lado: o que muda entre funções, operadores e estruturas, na ordem das semanas' }
];

const $ = (sel) => document.querySelector(sel);
let areaAtual = null;

function contar(area) { return ITENS.filter(i => i.grupo === area).length; }

function montarHome() {
  const box = $('#cats');
  box.innerHTML = '';
  AREAS.forEach(a => {
    const b = document.createElement('button');
    b.className = 'cat-btn';
    const n = a.id === 'Comp' ? `${COMP.length} comparativos` : `${contar(a.id)} itens`;
    b.innerHTML = `<strong>${a.titulo}</strong><span>${a.desc}<br>${n}</span>`;
    b.addEventListener('click', () => abrirArea(a.id));
    box.appendChild(b);
  });
}

function esconderTudo() {
  $('#home').classList.add('hidden');
  $('#categoria').classList.add('hidden');
  $('#comp').classList.add('hidden');
}

function abrirArea(id) {
  if (id === 'Comp') { abrirComp(); return; }
  areaAtual = id;
  const a = AREAS.find(x => x.id === id);
  esconderTudo();
  $('#categoria').classList.remove('hidden');
  $('#cat-titulo').textContent = a.titulo;
  $('#subtitulo').textContent = a.desc;
  $('#busca').value = '';
  renderLista();
  window.scrollTo(0, 0);
  $('#busca').focus();
}

function voltarHome() {
  areaAtual = null;
  esconderTudo();
  $('#home').classList.remove('hidden');
  $('#subtitulo').textContent = 'Escolha uma área para consultar quando tiver dúvida ou esquecer um comando.';
  montarHome();
  window.scrollTo(0, 0);
}

function abrirComp() {
  areaAtual = 'Comp';
  esconderTudo();
  $('#comp').classList.remove('hidden');
  $('#subtitulo').textContent = 'Lado a lado: o que muda entre funções, operadores e estruturas.';
  $('#buscaComp').value = '';
  renderComp();
  window.scrollTo(0, 0);
}

function modoBusca() {
  return document.querySelector('input[name="modo"]:checked').value;
}

function renderLista() {
  const termo = $('#busca').value.trim().toLowerCase();
  const modo = modoBusca();
  let lista = termo ? ITENS.slice() : ITENS.filter(i => i.grupo === areaAtual);
  if (termo) {
    lista = lista.filter(i => {
      const campo = modo === 'operacao' ? i.codigo : i.oque;
      return campo.toLowerCase().includes(termo);
    });
  }
  lista.sort((a, b) => a.codigo.localeCompare(b.codigo, 'pt-BR', { sensitivity: 'base' }));

  const box = $('#lista');
  box.innerHTML = '';
  $('#contador').textContent = `${lista.length} resultado(s)${termo ? ' em todas as áreas' : ''}`;
  if (!lista.length) {
    box.innerHTML = '<div class="vazio">Nada encontrado. Tente outra palavra ou troque o modo de busca.</div>';
    return;
  }
  const frag = document.createDocumentFragment();
  lista.forEach(i => {
    const d = document.createElement('article');
    d.className = 'item';
    d.innerHTML = `
      <div class="codigo"></div>
      <div class="cat"></div>
      <h4>O que faz</h4><p class="oque"></p>
      <h4>Exemplo prático</h4>
      <div class="exemplo"><button class="copy" type="button">Copiar</button><span class="ex-texto"></span></div>
      <h4>Quando usar</h4><p class="quando"></p>`;
    d.querySelector('.codigo').textContent = i.codigo;
    d.querySelector('.cat').textContent = termo ? `${i.grupo} · ${i.categoria}` : i.categoria;
    d.querySelector('.oque').textContent = i.oque;
    d.querySelector('.ex-texto').textContent = i.exemplo;
    d.querySelector('.quando').textContent = i.quando;
    d.querySelector('.copy').addEventListener('click', (e) => copiar(e.currentTarget, i.exemplo));
    frag.appendChild(d);
  });
  box.appendChild(frag);
}

function cardComp(c) {
  const art = document.createElement('article');
  art.className = 'item';
  const h = document.createElement('h3');
  h.className = 'comp-titulo';
  h.textContent = c.titulo;
  art.appendChild(h);

  const wrap = document.createElement('div');
  wrap.className = 'tabela-wrap';
  const t = document.createElement('table');
  t.className = 'comp-t';
  const thead = document.createElement('thead');
  const trh = document.createElement('tr');
  c.colunas.forEach(txt => {
    const th = document.createElement('th');
    th.scope = 'col';
    th.textContent = txt;
    trh.appendChild(th);
  });
  thead.appendChild(trh);
  t.appendChild(thead);

  const tbody = document.createElement('tbody');
  c.linhas.forEach(linha => {
    const tr = document.createElement('tr');
    linha.forEach((txt, k) => {
      const cell = document.createElement(k === 0 ? 'th' : 'td');
      if (k === 0) cell.scope = 'row';
      cell.textContent = txt;
      tr.appendChild(cell);
    });
    tbody.appendChild(tr);
  });
  t.appendChild(tbody);
  wrap.appendChild(t);
  art.appendChild(wrap);

  if (c.explica) {
    const e = document.createElement('p');
    e.className = 'comp-explica';
    e.textContent = c.explica;
    art.appendChild(e);
  }
  if (c.quando) {
    const q = document.createElement('p');
    q.className = 'comp-quando';
    q.textContent = 'Quando usar: ' + c.quando;
    art.appendChild(q);
  }
  if (c.obs) {
    const o = document.createElement('p');
    o.className = 'comp-obs';
    o.textContent = c.obs;
    art.appendChild(o);
  }
  return art;
}

function renderComp() {
  const termo = $('#buscaComp').value.trim().toLowerCase();
  const box = $('#listaComp');
  box.innerHTML = '';
  const semanas = [...new Set(COMP.map(c => c.semana))].sort((a, b) => a - b);
  let total = 0;
  semanas.forEach(s => {
    const itens = COMP.filter(c => c.semana === s &&
      (!termo || JSON.stringify(c).toLowerCase().includes(termo)));
    if (!itens.length) return;
    const h = document.createElement('h3');
    h.className = 'sem-titulo';
    h.textContent = 'Semana ' + s;
    box.appendChild(h);
    itens.forEach(c => { total++; box.appendChild(cardComp(c)); });
  });
  $('#contComp').textContent = `${total} comparativo(s)`;
  if (!total) box.innerHTML = '<div class="vazio">Nada encontrado. Tente outra palavra.</div>';
}

function copiar(botao, texto) {
  const feito = () => { botao.textContent = 'Copiado!'; setTimeout(() => botao.textContent = 'Copiar', 1200); };
  try {
    navigator.clipboard.writeText(texto).then(feito, () => fallback());
  } catch (e) { fallback(); }
  function fallback() {
    const t = document.createElement('textarea');
    t.value = texto; document.body.appendChild(t); t.select();
    try { document.execCommand('copy'); feito(); } catch (e) { botao.textContent = 'Erro'; }
    t.remove();
  }
}

$('#voltar').addEventListener('click', voltarHome);
$('#voltarComp').addEventListener('click', voltarHome);
$('#busca').addEventListener('input', renderLista);
$('#buscaComp').addEventListener('input', renderComp);
document.querySelectorAll('input[name="modo"]').forEach(r => r.addEventListener('change', renderLista));

// Tamanho da letra: de 10px a 16px, lembrado neste navegador
const FMIN = 10, FMAX = 16, FPADRAO = 14;
let tamAtual = FPADRAO;
try { const v = parseInt(localStorage.getItem('tamanhoFonte'), 10); if (!isNaN(v)) tamAtual = v; } catch (e) {}

function aplicarFonte(n) {
  tamAtual = Math.min(FMAX, Math.max(FMIN, n));
  document.documentElement.style.fontSize = tamAtual + 'px';
  $('#tam').textContent = tamAtual + 'px';
  $('#menos').disabled = tamAtual <= FMIN;
  $('#mais').disabled = tamAtual >= FMAX;
  try { localStorage.setItem('tamanhoFonte', String(tamAtual)); } catch (e) {}
}

$('#menos').addEventListener('click', () => aplicarFonte(tamAtual - 1));
$('#mais').addEventListener('click', () => aplicarFonte(tamAtual + 1));
aplicarFonte(tamAtual);

montarHome();
</script>
</body>
</html>
