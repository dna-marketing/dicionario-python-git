<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dicionário de Python e Git</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --text: #1d2330; --muted: #5d6676;
    --accent: #1f4e78; --accent-2: #e8f0f8; --code-bg: #eef1f5; --border: #dde2ea;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14171d; --card: #1d2230; --text: #e8ebf1; --muted: #a3acbb;
      --accent: #7fb2e5; --accent-2: #243044; --code-bg: #111520; --border: #2f3747;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14171d; --card: #1d2230; --text: #e8ebf1; --muted: #a3acbb;
    --accent: #7fb2e5; --accent-2: #243044; --code-bg: #111520; --border: #2f3747;
  }
  * { box-sizing: border-box; }
  html { font-size: 14px; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    line-height: 1.45; font-size: 1rem;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 16px; }
  header h1 { font-size: 1.2rem; margin: 8px 0 4px; color: var(--accent); }
  header p { margin: 0 0 12px; color: var(--muted); font-size: .85rem; }

  /* Tela inicial: botões das categorias */
  .cats { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
  .cat-btn {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 20px 16px; text-align: left; cursor: pointer; color: var(--text);
    font: inherit; transition: transform .1s, border-color .1s;
  }
  .cat-btn:hover, .cat-btn:focus-visible { border-color: var(--accent); transform: translateY(-2px); outline: none; }
  .cat-btn strong { display: block; font-size: 1rem; color: var(--accent); }
  .cat-btn span { color: var(--muted); font-size: .78rem; }

  /* Telas internas */
  .back {
    background: none; border: none; color: var(--accent); font: inherit; font-size: .85rem; font-weight: 600;
    cursor: pointer; padding: 6px 0; margin-bottom: 4px;
  }
  .tools {
    position: sticky; top: 0; background: var(--bg); padding: 8px 0 12px; z-index: 2;
  }
  .search {
    width: 100%; font: inherit; font-size: .88rem; padding: 9px 12px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--card); color: var(--text);
  }
  .search:focus { outline: 2px solid var(--accent); border-color: transparent; }
  .modo { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 8px 0 0; font-size: .8rem; }
  .modo label {
    border: 1px solid var(--border); border-radius: 999px; padding: 4px 10px; cursor: pointer; background: var(--card);
  }
  .modo input { margin-right: 6px; }
  .modo label:has(input:checked) { background: var(--accent-2); border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .count { color: var(--muted); font-size: .78rem; margin: 4px 0 8px; }

  .item {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 10px 12px; margin-bottom: 8px;
  }
  .item .codigo { font-family: ui-monospace, Consolas, monospace; font-weight: 700; font-size: .9rem; color: var(--accent); word-break: break-word; }
  .item .cat { color: var(--muted); font-size: max(10px, .74rem); margin-top: 1px; }
  .item h4 { margin: 8px 0 1px; font-size: max(9px, .68rem); text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .item p { margin: 0; }
  .exemplo {
    position: relative; background: var(--code-bg); border-radius: 8px; padding: 8px 70px 8px 10px; margin-top: 4px;
    font-family: ui-monospace, Consolas, monospace; font-size: .78rem; white-space: pre-wrap; word-break: break-word;
  }
  .copy {
    position: absolute; top: 5px; right: 5px; font: inherit; padding: 4px 8px;
    border-radius: 6px; border: 1px solid var(--border); background: var(--card); color: var(--text); cursor: pointer;
    font-size: max(10px, .7rem);
  }

  /* Comparativos */
  .sem-titulo { font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 18px 0 8px; }
  .comp-titulo { margin: 0 0 8px; font-size: .98rem; color: var(--accent); }
  .comp-dica { color: var(--muted); font-size: .74rem; margin: 0 0 8px; }
  .tabela-wrap {
    overflow-x: auto; -webkit-overflow-scrolling: touch;
    border: 1px solid var(--border); border-radius: 10px;
  }
  .comp-t { border-collapse: collapse; width: 100%; min-width: 520px; font-size: .82rem; }
  .comp-t th, .comp-t td {
    border-bottom: 1px solid var(--border); border-right: 1px solid var(--border);
    padding: 7px 8px; text-align: left; vertical-align: top;
  }
  .comp-t tr > *:last-child { border-right: none; }
  .comp-t tbody tr:last-child > * { border-bottom: none; }
  .comp-t thead th { background: var(--accent-2); color: var(--accent); font-weight: 700; }
  .comp-t tbody th { background: var(--code-bg); font-weight: 600; min-width: 110px; }
  .comp-quando {
    margin: 10px 0 0; font-size: .85rem; background: var(--accent-2); color: var(--text);
    border-radius: 8px; padding: 6px 10px;
  }
  .comp-obs { margin: 6px 0 0; font-size: .74rem; color: var(--muted); }
  .comp-explica { margin: 10px 0 0; font-size: .84rem; border-left: 3px solid var(--accent); padding: 2px 0 2px 10px; }

  .vazio { text-align: center; color: var(--muted); padding: 24px 8px; font-size: .85rem; }
  .hidden { display: none !important; }
  .ajuste { display: flex; gap: 6px; align-items: center; margin: 0 0 10px; }
  .ajuste button {
    font: inherit; font-weight: 700; border: 1px solid var(--border); background: var(--card); color: var(--text);
    border-radius: 8px; padding: 2px 10px; cursor: pointer;
  }
  .ajuste button:disabled { opacity: .4; cursor: default; }
  .ajuste span { font-size: .8rem; color: var(--muted); min-width: 4em; text-align: center; }
  footer { color: var(--muted); font-size: .75rem; text-align: center; padding: 24px 0 8px; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Dicionário de Python e Git</h1>
    <p id="subtitulo">Escolha uma área para consultar quando tiver dúvida ou esquecer um comando.</p>
    <div class="ajuste" aria-label="Tamanho da letra">
      <button id="menos" type="button" aria-label="Diminuir letra">A−</button>
      <span id="tam">14px</span>
      <button id="mais" type="button" aria-label="Aumentar letra">A+</button>
    </div>
  </header>

  <!-- TELA INICIAL -->
  <section id="home">
    <div class="cats" id="cats"></div>
  </section>

  <!-- TELA DA CATEGORIA -->
  <section id="categoria" class="hidden">
    <button class="back" id="voltar">← Voltar às áreas</button>
    <h2 id="cat-titulo" style="margin:0 0 4px"></h2>
    <div class="tools">
      <input id="busca" class="search" type="search" placeholder="Digite o que procura..." autocomplete="off">
      <div class="modo" role="radiogroup" aria-label="Buscar por">
        <span style="color:var(--muted)">Buscar por:</span>
        <label><input type="radio" name="modo" value="operacao" checked>Operação (o comando)</label>
        <label><input type="radio" name="modo" value="oquefaz">O que faz (a explicação)</label>
      </div>
    </div>
    <div class="count" id="contador"></div>
    <div id="lista"></div>
  </section>

  <!-- TELA DOS COMPARATIVOS -->
  <section id="comp" class="hidden">
    <button class="back" id="voltarComp">← Voltar às áreas</button>
    <h2 style="margin:0 0 4px; color:var(--accent); font-size:1.1rem">Comparativos</h2>
    <div class="tools">
      <input id="buscaComp" class="search" type="search" placeholder="Ex.: merge, read_csv, git, lista..." autocomplete="off">
    </div>
    <p class="comp-dica">No celular, arraste a tabela para o lado para ver todas as colunas.</p>
    <div class="count" id="contComp"></div>
    <div id="listaComp"></div>
  </section>

  <footer>Os dados ficam dentro desta página. Funciona offline depois de aberta.</footer>
</div>

<script>
const ITENS = [{"codigo": ".agg()", "categoria": "Agregação (Pandas)", "oque": "Calcula vários indicadores de uma vez para cada grupo.", "exemplo": "df.groupby(\"Canal\").agg(total=(\"Valor_Venda\", \"sum\"), media=(\"Valor_Venda\", \"mean\"))", "quando": "para montar um quadro-resumo com vários números ao mesmo tempo.", "grupo": "Bibliotecas"}, {"codigo": ".agg(lambda)", "categoria": "Agregação (pandas)", "oque": "Aplica uma função própria a cada grupo.", "exemplo": "df.groupby(\"regiao\")[\"valor\"].agg(lambda x: x.max() - x.min())", "quando": "para calcular medidas que não existem prontas, como a amplitude.", "grupo": "Bibliotecas"}, {"codigo": ".count()", "categoria": "Agregação (Pandas)", "oque": "Conta quantos valores preenchidos existem.", "exemplo": "df.groupby(\"Canal\")[\"Valor_Venda\"].count()", "quando": "para saber quantas vendas há em cada grupo.", "grupo": "Bibliotecas"}, {"codigo": ".cumsum()", "categoria": "Agregação (Pandas)", "oque": "Soma acumulada, linha a linha.", "exemplo": "df[\"Valor_Venda\"].cumsum()", "quando": "para ver o total acumulado ao longo do tempo.", "grupo": "Bibliotecas"}, {"codigo": ".groupby()", "categoria": "Agregação (Pandas)", "oque": "Agrupa as linhas pelo valor de uma ou mais colunas, para calcular totais ou médias por grupo.", "exemplo": "df.groupby(\"Região\")[\"Valor_Venda\"].sum()", "quando": "para responder perguntas como \"quanto vendemos por região, canal ou produto?\".", "grupo": "Bibliotecas"}, {"codigo": ".idxmax()", "categoria": "Agregação (Pandas)", "oque": "Devolve o nome do grupo com o maior valor.", "exemplo": "totais.idxmax()", "quando": "para descobrir qual região ou produto é o campeão de vendas.", "grupo": "Bibliotecas"}, {"codigo": ".idxmin()", "categoria": "Agregação (Pandas)", "oque": "Devolve o nome do grupo com o menor valor.", "exemplo": "totais.idxmin()", "quando": "para descobrir o item com o pior desempenho.", "grupo": "Bibliotecas"}, {"codigo": ".max()", "categoria": "Agregação (Pandas)", "oque": "Maior valor.", "exemplo": "df[\"Valor_Venda\"].max()", "quando": "para achar a venda mais alta.", "grupo": "Bibliotecas"}, {"codigo": ".mean()", "categoria": "Agregação (Pandas)", "oque": "Média aritmética dos valores.", "exemplo": "df[\"Valor_Venda\"].mean()", "quando": "para saber o valor médio de cada venda (ticket médio).", "grupo": "Bibliotecas"}, {"codigo": ".median()", "categoria": "Agregação (Pandas)", "oque": "Valor do meio, depois de ordenar os dados.", "exemplo": "df[\"Valor_Venda\"].median()", "quando": "quando alguns valores muito altos distorcem a média.", "grupo": "Bibliotecas"}, {"codigo": ".min()", "categoria": "Agregação (Pandas)", "oque": "Menor valor.", "exemplo": "df[\"Valor_Venda\"].min()", "quando": "para achar a venda mais baixa.", "grupo": "Bibliotecas"}, {"codigo": ".nlargest()", "categoria": "Agregação (Pandas)", "oque": "Pega as N linhas com os maiores valores.", "exemplo": "df.nlargest(5, \"Valor_Venda\")", "quando": "para ver o top 5 de vendas.", "grupo": "Bibliotecas"}, {"codigo": ".nsmallest()", "categoria": "Agregação (Pandas)", "oque": "Pega as N linhas com os menores valores.", "exemplo": "df.nsmallest(5, \"Valor_Venda\")", "quando": "para ver as vendas mais baixas.", "grupo": "Bibliotecas"}, {"codigo": ".round()", "categoria": "Agregação (Pandas)", "oque": "Arredonda os números para uma quantidade de casas decimais.", "exemplo": "df.groupby(\"Canal\")[\"Valor_Venda\"].mean().round(2)", "quando": "para deixar valores em dinheiro com duas casas decimais.", "grupo": "Bibliotecas"}, {"codigo": ".std()", "categoria": "Agregação (Pandas)", "oque": "Desvio padrão: o quanto os valores se afastam da média.", "exemplo": "df[\"Valor_Venda\"].std()", "quando": "para medir a dispersão e encontrar valores fora do padrão.", "grupo": "Bibliotecas"}, {"codigo": ".sum()", "categoria": "Agregação (Pandas)", "oque": "Soma os valores de uma coluna ou de um grupo.", "exemplo": "df[\"Valor_Venda\"].sum()", "quando": "para o total de vendas.", "grupo": "Bibliotecas"}, {"codigo": "json.dumps()", "categoria": "Arquivos (JSON)", "oque": "Transforma dados do Python em texto JSON.", "exemplo": "json.dumps(dados, indent=2, ensure_ascii=False)", "quando": "para mostrar um JSON organizado na tela.", "grupo": "Python"}, {"codigo": "json.load()", "categoria": "Arquivos (JSON)", "oque": "Lê um arquivo JSON e transforma em dados do Python.", "exemplo": "dados = json.load(f)", "quando": "para abrir um JSON salvo no computador.", "grupo": "Python"}, {"codigo": "open(encoding=)", "categoria": "Arquivos (Python)", "oque": "Abre um arquivo escolhendo como os caracteres são lidos.", "exemplo": "open(\"dados.json\", \"r\", encoding=\"utf-8\")", "quando": "para ler arquivos com acentos sem erro.", "grupo": "Python"}, {"codigo": ".join()", "categoria": "Combinação (Pandas)", "oque": "Junta tabelas usando o índice (nome das linhas).", "exemplo": "df1.join(df2)", "quando": "quando as tabelas são organizadas pelo mesmo índice.", "grupo": "Bibliotecas"}, {"codigo": ".merge()", "categoria": "Combinação (Pandas)", "oque": "Junta duas tabelas usando uma coluna em comum, como o JOIN do SQL.", "exemplo": "df.merge(metas, on=\"Região\", how=\"left\")", "quando": "para trazer informações de outra tabela, como metas por região.", "grupo": "Bibliotecas"}, {"codigo": "pd.concat()", "categoria": "Combinação (Pandas)", "oque": "Empilha tabelas, uma embaixo da outra ou lado a lado.", "exemplo": "pd.concat([df_2024, df_2025])", "quando": "para juntar arquivos de períodos diferentes com as mesmas colunas.", "grupo": "Bibliotecas"}, {"codigo": "pd.pivot_table()", "categoria": "Combinação (Pandas)", "oque": "Cria uma tabela cruzada com resumo, como a Tabela Dinâmica do Excel.", "exemplo": "pd.pivot_table(df, values=\"Valor_Venda\", index=\"Região\", columns=\"Canal\", aggfunc=\"sum\")", "quando": "para cruzar duas categorias, como região e canal, com um número.", "grupo": "Bibliotecas"}, {"codigo": ".equals()", "categoria": "Comparação (pandas)", "oque": "Confere se duas tabelas são exatamente iguais.", "exemplo": "df_original.equals(df_csv) # True", "quando": "para validar se um arquivo salvo e lido de novo ficou igual ao original.", "grupo": "Bibliotecas"}, {"codigo": "Outlier", "categoria": "Conceito (Estatística)", "oque": "Valor muito distante do padrão dos dados.", "exemplo": "df[df[\"Valor_Venda\"] > media + 2 * std]", "quando": "para achar vendas atípicas, que podem ser erro ou destaque.", "grupo": "Python"}, {"codigo": "Parâmetro nomeado", "categoria": "Conceito (Funções)", "oque": "Argumento enviado com o nome do parâmetro, podendo mudar a ordem.", "exemplo": "pd.read_csv(\"vendas.csv\", sep=\";\")", "quando": "em funções com muitas opções, para o código ficar claro.", "grupo": "Python"}, {"codigo": "Parâmetro posicional", "categoria": "Conceito (Funções)", "oque": "Argumento enviado na ordem exata dos parâmetros da função.", "exemplo": "ler_arquivo(\"vendas.csv\", \";\")", "quando": "em funções simples, em que você lembra a ordem.", "grupo": "Python"}, {"codigo": "Valor padrão", "categoria": "Conceito (Funções)", "oque": "Valor usado quando o argumento não é informado.", "exemplo": "def filtrar(regiao=\"todas\"): ...", "quando": "para deixar um parâmetro opcional.", "grupo": "Python"}, {"codigo": "Chave de junção", "categoria": "Conceito (Merge)", "oque": "Coluna comum que liga duas tabelas.", "exemplo": "on=\"Região\"", "quando": "antes de fazer um merge, para identificar qual coluna liga as duas tabelas.", "grupo": "Python"}, {"codigo": "Vetorização", "categoria": "Conceito (NumPy e Pandas)", "oque": "Aplicar uma operação a todos os valores de uma vez, sem for.", "exemplo": "df[\"Valor_Venda\"] * 0.05", "quando": "sempre que possível, em vez de loops. É mais rápido e mais curto.", "grupo": "Bibliotecas"}, {"codigo": "Broadcasting", "categoria": "Conceito (NumPy)", "oque": "O NumPy faz uma conta entre arrays de tamanhos diferentes, repetindo o menor automaticamente.", "exemplo": "precos * 1.15", "quando": "para aplicar uma taxa ou desconto a uma tabela inteira. Uso avançado no começo.", "grupo": "Bibliotecas"}, {"codigo": "Máscara booleana", "categoria": "Conceito (Pandas)", "oque": "Lista de True e False que indica quais linhas passam no filtro.", "exemplo": "mascara = df[\"Canal\"] == \"Loja Física\"", "quando": "para guardar um filtro e reaproveitá-lo.", "grupo": "Bibliotecas"}, {"codigo": "Indentação", "categoria": "Conceito (Python)", "oque": "Python usa o recuo (4 espaços) para saber o que está dentro de cada bloco.", "exemplo": "if x > 0:  e logo abaixo  print(\"ok\")", "quando": "sempre que escrever if, for, while ou def. Sem recuo aparece IndentationError.", "grupo": "Python"}, {"codigo": "break", "categoria": "Controle de Fluxo", "oque": "Interrompe a execução de um loop.", "exemplo": "for i in range(10): if i == 5: break", "quando": "Como um \"pare!\": a repetição para assim que a condição acontece.", "grupo": "Python"}, {"codigo": "continue", "categoria": "Controle de Fluxo", "oque": "Pula para a próxima iteração de um loop.", "exemplo": "for i in range(3): if i == 1: continue", "quando": "Como um \"pule esta volta\": ignora o resto desta rodada e segue para a próxima.", "grupo": "Python"}, {"codigo": "elif", "categoria": "Controle de Fluxo", "oque": "Condição extra (\"senão se\") dentro de um if.", "exemplo": "if x > 0: ... elif x < 0: ...", "quando": "Uma segunda pergunta, feita só quando a primeira for \"não\".", "grupo": "Python"}, {"codigo": "else", "categoria": "Controle de Fluxo", "oque": "Bloco final, executado quando nenhuma condição anterior foi verdadeira.", "exemplo": "if x > 0: ... else: ...", "quando": "O \"caso contrário\": o que fazer quando nenhuma das perguntas anteriores deu sim.", "grupo": "Python"}, {"codigo": "if", "categoria": "Controle de Fluxo", "oque": "Executa um trecho de código somente se a condição for verdadeira.", "exemplo": "if x > 0: print('Positivo')", "quando": "Uma pergunta: \"isso é verdade? Então faça isto\".", "grupo": "Python"}, {"codigo": "if, elif, else (eliminação)", "categoria": "Controle de fluxo", "oque": "O Python testa as condições em ordem e para na primeira que for verdadeira. O else pega o que sobrou. Não é preciso escrever a última condição.", "exemplo": "if v >= 50000: \"Top\" elif v >= 10000: \"Médio\" else: \"Baixo\"", "quando": "Para classificar valores em faixas, como Top, Médio e Baixo.", "grupo": "Python"}, {"codigo": "pass", "categoria": "Controle de Fluxo", "oque": "Comando vazio, usado como espaço reservado.", "exemplo": "if True: pass", "quando": "Uma gaveta vazia: o código exige algo ali, mas por enquanto não há nada a fazer.", "grupo": "Python"}, {"codigo": "range", "categoria": "Controle de Fluxo", "oque": "Gera uma sequência de números.", "exemplo": "list(range(0, 5)) # [0, 1, 2, 3, 4]", "quando": "Cria uma lista de números em ordem sem você digitar um por um. O último número nunca entra.", "grupo": "Python"}, {"codigo": "for", "categoria": "Controle de Fluxo (Loop)", "oque": "Repete um bloco para cada item de uma sequência (lista, dicionário, coluna).", "exemplo": "for nome in ['Ana', 'Bia']: print(nome)", "quando": "Repete \"para cada item da lista\". Use quando já sabe o que vai percorrer.", "grupo": "Python"}, {"codigo": "for (laço com lista)", "categoria": "Controle de Fluxo (Loop)", "oque": "Percorre cada item de uma lista, um por vez.", "exemplo": "for regiao in regioes: print(regiao)", "quando": "para repetir uma ação para cada item de uma lista.", "grupo": "Python"}, {"codigo": "while", "categoria": "Controle de Fluxo (Loop)", "oque": "Repete um bloco enquanto a condição for verdadeira. Atenção: algo dentro do bloco precisa mudar a condição, senão o loop nunca termina.", "exemplo": "while x > 0: x -= 1", "quando": "Repete \"enquanto isso for verdade\". Use quando não sabe quantas voltas vai dar.", "grupo": "Python"}, {"codigo": "Convenções de nomes", "categoria": "Convenções (Python)", "oque": "camelCase: valorFinal. PascalCase: ValorFinal. snake_case: valor_final.", "exemplo": "valor_final = 10", "quando": "ao escolher nomes de variáveis e funções. Em Python, o padrão é snake_case.", "grupo": "Python"}, {"codigo": ".strftime()", "categoria": "Datas (datetime)", "oque": "Transforma uma data em texto no formato que você escolher.", "exemplo": "hoje.strftime(\"%d/%m/%Y\")", "quando": "para mostrar datas no formato brasileiro, como 08/10/2026.", "grupo": "Python"}, {"codigo": "datetime.now()", "categoria": "Datas (datetime)", "oque": "Retorna a data e a hora atuais.", "exemplo": "from datetime import datetime ; datetime.now()", "quando": "para registrar quando um relatório foi gerado.", "grupo": "Python"}, {"codigo": "datetime.today()", "categoria": "Datas (datetime)", "oque": "Retorna a data e a hora de hoje.", "exemplo": "hoje = datetime.today()", "quando": "para calcular há quantos dias uma venda aconteceu.", "grupo": "Python"}, {"codigo": "timedelta", "categoria": "Datas (datetime)", "oque": "Representa uma diferença de tempo, em dias, horas ou minutos.", "exemplo": "datetime.now() - timedelta(days=90)", "quando": "para voltar ou avançar um período, como os últimos 90 dias.", "grupo": "Python"}, {"codigo": "Códigos de data (%d, %m, %Y)", "categoria": "Datas (formatos)", "oque": "%d é o dia, %m é o mês, %Y é o ano com 4 dígitos, %H é a hora e %M são os minutos.", "exemplo": "\"%d/%m/%Y %H:%M\"", "quando": "sempre que for converter data em texto ou ler uma data com formato específico.", "grupo": "Python"}, {"codigo": ".dt.day", "categoria": "Datas (pandas)", "oque": "Extrai o dia do mês de cada data.", "exemplo": "df[\"Data\"].dt.day", "quando": "quando precisa só do dia.", "grupo": "Bibliotecas"}, {"codigo": ".dt.day_name()", "categoria": "Datas (pandas)", "oque": "Retorna o nome do dia da semana.", "exemplo": "df[\"Data\"].dt.day_name()", "quando": "para descobrir em que dia da semana as vendas acontecem mais.", "grupo": "Bibliotecas"}, {"codigo": ".dt.days", "categoria": "Datas (pandas)", "oque": "Transforma uma diferença entre datas em número de dias.", "exemplo": "(hoje - df[\"Data\"]).dt.days", "quando": "para saber há quantos dias cada venda aconteceu.", "grupo": "Bibliotecas"}, {"codigo": ".dt.month", "categoria": "Datas (pandas)", "oque": "Extrai o mês de cada data.", "exemplo": "df[\"Data\"].dt.month", "quando": "para agrupar vendas por mês.", "grupo": "Bibliotecas"}, {"codigo": ".dt.year", "categoria": "Datas (pandas)", "oque": "Extrai o ano de cada data de uma coluna.", "exemplo": "df[\"Data\"].dt.year", "quando": "para filtrar ou agrupar vendas por ano.", "grupo": "Bibliotecas"}, {"codigo": "pd.Timestamp.today()", "categoria": "Datas (pandas)", "oque": "Data e hora atuais no formato do pandas.", "exemplo": "pd.Timestamp.today()", "quando": "quando a análise compara datas de uma coluna do pandas com o dia de hoje.", "grupo": "Bibliotecas"}, {"codigo": "pd.to_datetime()", "categoria": "Datas (Pandas)", "oque": "Converte texto em data.", "exemplo": "pd.to_datetime(df[\"Data\"], dayfirst=True)", "quando": "quando as datas vêm como texto ou em formatos misturados.", "grupo": "Bibliotecas"}, {"codigo": "assert", "categoria": "Depuração", "oque": "Confere se uma condição é verdadeira; se não for, o programa para com uma mensagem.", "exemplo": "assert x > 0, 'Deve ser positivo'", "quando": "Um teste de segurança que avisa quando algo não está como deveria.", "grupo": "Python"}, {"codigo": "breakpoint", "categoria": "Depuração", "oque": "Pausa o programa neste ponto para inspeção.", "exemplo": "breakpoint()", "quando": "Um \"pare aqui\" para você olhar o que está acontecendo por dentro.", "grupo": "Python"}, {"codigo": "dicionário.get()", "categoria": "Dicionários (métodos)", "oque": "Busca uma chave sem dar erro se ela não existir. Você pode informar um valor padrão.", "exemplo": "precos.get(\"Outro\", 0)", "quando": "Quando não tem certeza se a chave existe.", "grupo": "Python"}, {"codigo": "dicionário.items()", "categoria": "Dicionários (métodos)", "oque": "Entrega os pares chave e valor juntos, para percorrer com um for.", "exemplo": "for produto, preco in precos.items():", "quando": "Para percorrer o dicionário inteiro.", "grupo": "Python"}, {"codigo": "dicionário.keys()", "categoria": "Dicionários (métodos)", "oque": "Mostra todas as chaves do dicionário (os nomes).", "exemplo": "precos.keys()", "quando": "Para ver quais nomes estão guardados.", "grupo": "Python"}, {"codigo": "dicionário.values()", "categoria": "Dicionários (métodos)", "oque": "Mostra todos os valores do dicionário.", "exemplo": "precos.values()", "quando": "Para ver só os valores, sem os nomes.", "grupo": "Python"}, {"codigo": ".get() (dicionário)", "categoria": "Dicionários (Python)", "oque": "Pega um valor pela chave e devolve um padrão se a chave não existir.", "exemplo": "valor_medio.get(\"Outro\", 0)", "quando": "para evitar erro quando você não tem certeza se a chave existe.", "grupo": "Python"}, {"codigo": "Acesso por chave", "categoria": "Dicionários (Python)", "oque": "Lê o valor guardado com uma chave.", "exemplo": "valor_medio[\"Rolha Premium\"]", "quando": "para consultar um preço específico.", "grupo": "Python"}, {"codigo": "Adicionar ou atualizar chave", "categoria": "Dicionários (Python)", "oque": "Cria um par chave-valor novo, ou troca o valor de uma chave existente.", "exemplo": "valor_medio[\"Paçoca Mini\"] = 1.99", "quando": "para incluir um produto novo ou atualizar um preço.", "grupo": "Python"}, {"codigo": "input()", "categoria": "Entrada de dados", "oque": "Pede que o usuário digite algo e guarda a resposta. A resposta sempre é texto.", "exemplo": "nome = input(\"Qual é o seu nome? \")", "quando": "Para programas que conversam com quem os usa.", "grupo": "Python"}, {"codigo": "global", "categoria": "Escopo", "oque": "Declara uma variável global, acessível em todo o programa.", "exemplo": "global x", "quando": "Diz que a variável vale para o programa inteiro, não só dentro de uma função.", "grupo": "Python"}, {"codigo": "globals", "categoria": "Escopo", "oque": "Retorna um dicionário com as variáveis globais atuais.", "exemplo": "globals()", "quando": "Uma lista de todas as variáveis que valem para o programa todo.", "grupo": "Python"}, {"codigo": "locals", "categoria": "Escopo", "oque": "Retorna um dicionário com as variáveis do lugar onde você está.", "exemplo": "locals()", "quando": "A lista das variáveis que existem só dentro da função atual.", "grupo": "Python"}, {"codigo": "nonlocal", "categoria": "Escopo", "oque": "Declara uma variável de uma função de fora, usada dentro de uma função interna.", "exemplo": "nonlocal x", "quando": "Permite mudar uma variável que pertence a uma função \"de fora\".", "grupo": "Python"}, {"codigo": ".columns", "categoria": "Estrutura (Pandas)", "oque": "Lista com os nomes das colunas.", "exemplo": "print(df.columns)", "quando": "para conferir o nome exato das colunas antes de filtrar. Um espaço a mais já muda o nome.", "grupo": "Bibliotecas"}, {"codigo": ".copy()", "categoria": "Estrutura (pandas)", "oque": "Cria uma cópia independente da tabela.", "exemplo": "df2 = df.copy()", "quando": "para mexer em uma cópia sem alterar a tabela original.", "grupo": "Bibliotecas"}, {"codigo": ".index", "categoria": "Estrutura (Pandas)", "oque": "Os nomes (rótulos) das linhas. Por padrão são 0, 1, 2...", "exemplo": "print(df.index)", "quando": "para entender como as linhas estão identificadas.", "grupo": "Bibliotecas"}, {"codigo": ".to_dict()", "categoria": "Estrutura (pandas)", "oque": "Converte uma tabela ou resultado em dicionário Python.", "exemplo": "resumo.to_dict()", "quando": "quando outro trecho do código espera um dicionário.", "grupo": "Bibliotecas"}, {"codigo": ".tolist()", "categoria": "Estrutura (pandas)", "oque": "Converte uma coluna, índice ou lista de nomes em lista Python.", "exemplo": "df.columns.tolist()", "quando": "para ver os nomes das colunas como uma lista comum.", "grupo": "Bibliotecas"}, {"codigo": ".values", "categoria": "Estrutura (Pandas)", "oque": "Os dados puros, sem nomes de linhas e colunas.", "exemplo": "df.values", "quando": "quando precisar só dos números, por exemplo para usar no NumPy.", "grupo": "Bibliotecas"}, {"codigo": "pd.DataFrame()", "categoria": "Estrutura (Pandas)", "oque": "Estrutura de duas dimensões: linhas e colunas, como uma planilha.", "exemplo": "df = pd.DataFrame({\"Região\": [\"Blumenau\"], \"Unidades\": [1500]})", "quando": "para criar uma tabela do zero, por exemplo a partir de um dicionário.", "grupo": "Bibliotecas"}, {"codigo": "pd.Series()", "categoria": "Estrutura (Pandas)", "oque": "Estrutura de uma dimensão: uma coluna com índice.", "exemplo": "s = pd.Series([10, 20, 30])", "quando": "quando você só trabalha com uma coluna isolada.", "grupo": "Bibliotecas"}, {"codigo": "desempacotamento", "categoria": "Estruturas de dados", "oque": "Separa os itens de uma tupla em variáveis diferentes, de uma vez.", "exemplo": "regiao, canal = par", "quando": "Para pegar cada valor de uma tupla com nomes próprios.", "grupo": "Python"}, {"codigo": "dicionário", "categoria": "Estruturas de dados", "oque": "Coleção de pares chave → valor, como uma tabela de consulta. Usa chaves { }.", "exemplo": "precos = {\"Paçoca\": 3.50, \"Rolha\": 7.90}", "quando": "Para ligar um produto ao seu preço, ou um registro aos seus dados.", "grupo": "Python"}, {"codigo": "dicionário[chave]", "categoria": "Estruturas de dados", "oque": "Pega o valor guardado com aquela chave.", "exemplo": "precos[\"Rolha\"] → 7.90", "quando": "Para consultar um valor pelo nome da chave.", "grupo": "Python"}, {"codigo": "tupla", "categoria": "Estruturas de dados", "oque": "Coleção ordenada e imutável: depois de criada, os itens não podem ser alterados. Usa parênteses.", "exemplo": "par = (\"Sul\", \"Varejo\")", "quando": "Para dados fixos, como coordenadas ou pares que não devem mudar.", "grupo": "Python"}, {"codigo": ".to_csv()", "categoria": "Exportação (Pandas)", "oque": "Salva a tabela num arquivo CSV.", "exemplo": "df.to_csv(\"resultado.csv\", index=False)", "quando": "para exportar um resultado para outros programas ou para o Excel.", "grupo": "Bibliotecas"}, {"codigo": ".to_excel()", "categoria": "Exportação (Pandas)", "oque": "Salva a tabela numa planilha Excel.", "exemplo": "df.to_excel(\"resultado.xlsx\", index=False)", "quando": "para entregar o resultado em planilha.", "grupo": "Bibliotecas"}, {"codigo": ".to_json()", "categoria": "Exportação (Pandas)", "oque": "Salva a tabela em formato JSON.", "exemplo": "df.to_json(\"vendas.json\", orient=\"records\")", "quando": "para enviar dados a sistemas que pedem JSON.", "grupo": "Bibliotecas"}, {"codigo": "& (filtro pandas)", "categoria": "Filtro (pandas)", "oque": "Combina duas condições: as duas precisam ser verdadeiras. Cada condição fica entre parênteses.", "exemplo": "df[(df[\"Canal\"] == \"E-Commerce\") & (df[\"Valor_Venda\"] > 500)]", "quando": "para filtrar por duas regras ao mesmo tempo.", "grupo": "Bibliotecas"}, {"codigo": "| (filtro pandas)", "categoria": "Filtro (pandas)", "oque": "Combina duas condições: basta uma ser verdadeira.", "exemplo": "df[(df[\"Região\"] == \"Sul\") | (df[\"Região\"] == \"Nordeste\")]", "quando": "para aceitar uma condição ou outra.", "grupo": "Bibliotecas"}, {"codigo": "~ (filtro pandas)", "categoria": "Filtro (pandas)", "oque": "Inverte a condição do filtro.", "exemplo": "df[~(df[\"Região\"] == \"Blumenau\")]", "quando": "para tirar uma categoria do resultado.", "grupo": "Bibliotecas"}, {"codigo": "chaves {} na f-string", "categoria": "Formatação de texto", "oque": "Dentro de uma f-string, {} indica o lugar onde o Python coloca o valor de uma variável. As chaves não servem para dar nome à variável.", "exemplo": "f\"Olá, {nome}! Você tem {idade} anos.\"", "quando": "Para montar frases com os valores do seu programa.", "grupo": "Python"}, {"codigo": "f-string com :.2f", "categoria": "Formatação de texto", "oque": "Mostra um número com duas casas decimais dentro do texto. O f depois do ponto significa número decimal.", "exemplo": "f\"R$ {preco:.2f}\" → R$ 7.90", "quando": "Para mostrar valores em dinheiro de forma padronizada.", "grupo": "Python"}, {"codigo": "def", "categoria": "Funções", "oque": "Define uma nova função (bloco de código com nome, reutilizável).", "exemplo": "def soma(a, b): return a + b", "quando": "Cria uma receita com nome que você pode usar quantas vezes quiser.", "grupo": "Python"}, {"codigo": "lambda", "categoria": "Funções", "oque": "Cria uma função curta, sem nome.", "exemplo": "dobro = lambda x: x * 2", "quando": "Uma função de uma linha só, sem precisar dar nome.", "grupo": "Python"}, {"codigo": "return", "categoria": "Funções", "oque": "Encerra a função e devolve um resultado.", "exemplo": "return x + 1", "quando": "Entrega o resultado final da receita para quem pediu.", "grupo": "Python"}, {"codigo": "yield", "categoria": "Funções", "oque": "Devolve um valor e pausa a função, que pode continuar depois.", "exemplo": "yield i", "quando": "Entrega um item de cada vez, sem guardar tudo de uma vez na memória.", "grupo": "Python"}, {"codigo": "Valor padrão mutável (cuidado)", "categoria": "Funções (conceito)", "oque": "Não use lista ou dicionário como valor padrão. Use None e crie a estrutura dentro da função.", "exemplo": "def f(itens=None): itens = itens or []", "quando": "sempre que o valor padrão for uma estrutura que pode ser alterada.", "grupo": "Python"}, {"codigo": "filter com lambda", "categoria": "Funções (lambda)", "oque": "Mantém só os itens que passam numa condição.", "exemplo": "list(filter(lambda x: x > 0, [-1, 2]))", "quando": "para peneirar uma lista com uma regra curta.", "grupo": "Python"}, {"codigo": "map com lambda", "categoria": "Funções (lambda)", "oque": "Aplica uma função curta a cada item de uma lista.", "exemplo": "list(map(lambda x: x * 2, [1, 2]))", "quando": "para transformar todos os valores de uma lista de forma curta.", "grupo": "Python"}, {"codigo": "**kwargs", "categoria": "Funções (parâmetros)", "oque": "Recebe uma quantidade variável de argumentos nomeados, como um dicionário.", "exemplo": "def filtrar(**filtros): ...", "quando": "para aceitar filtros que mudam a cada chamada, como Regiao=\"Sul\".", "grupo": "Python"}, {"codigo": "*args", "categoria": "Funções (parâmetros)", "oque": "Recebe uma quantidade variável de valores posicionais, como uma tupla.", "exemplo": "def comparar(*regioes): ...", "quando": "quando não se sabe quantos valores serão passados para a função.", "grupo": "Python"}, {"codigo": "Docstring", "categoria": "Funções (Python)", "oque": "Texto explicativo logo no começo da função, entre três aspas.", "exemplo": "def f(): \"\"\"Calcula a média.\"\"\"", "quando": "para documentar o que a função faz, para você mesmo e para a equipe.", "grupo": "Python"}, {"codigo": "__import__", "categoria": "Funções Embutidas", "oque": "Importa um módulo pelo nome, escrito como texto.", "exemplo": "math = __import__('math')", "quando": "Faz o mesmo que o import, mas com o nome em texto. Uso avançado.", "grupo": "Python"}, {"codigo": "abs", "categoria": "Funções Embutidas", "oque": "Retorna o valor absoluto (sem o sinal) de um número.", "exemplo": "abs(-5) # Retorna 5", "quando": "Tira o sinal de menos: -5 vira 5.", "grupo": "Python"}, {"codigo": "aiter", "categoria": "Funções Embutidas", "oque": "Retorna um iterador assíncrono para um objeto assíncrono iterável.", "exemplo": "it = aiter(fonte)", "quando": "Versão \"assíncrona\" do iter. Uso avançado.", "grupo": "Python"}, {"codigo": "all", "categoria": "Funções Embutidas", "oque": "Retorna True se todos os itens forem verdadeiros.", "exemplo": "all([True, True, False]) # Retorna False", "quando": "\"Todos passaram?\" Basta um reprovado para a resposta ser não.", "grupo": "Python"}, {"codigo": "anext", "categoria": "Funções Embutidas", "oque": "Retorna o próximo item de um iterador assíncrono (use com await).", "exemplo": "item = await anext(it)", "quando": "Versão \"assíncrona\" do next. Uso avançado.", "grupo": "Python"}, {"codigo": "any", "categoria": "Funções Embutidas", "oque": "Retorna True se pelo menos um item for verdadeiro.", "exemplo": "any([False, False, True]) # Retorna True", "quando": "\"Algum passou?\" Basta um aprovado para a resposta ser sim.", "grupo": "Python"}, {"codigo": "ascii", "categoria": "Funções Embutidas", "oque": "Retorna o objeto em forma de texto só com caracteres simples (sem acentos).", "exemplo": "ascii('olá') # Retorna 'ol\\xe1'", "quando": "Troca letras com acento por códigos especiais.", "grupo": "Python"}, {"codigo": "bin", "categoria": "Funções Embutidas", "oque": "Converte um número inteiro para binário (só 0 e 1).", "exemplo": "bin(5) # Retorna '0b101'", "quando": "Traduz o número para a linguagem de 0 e 1 que o computador usa.", "grupo": "Python"}, {"codigo": "bool", "categoria": "Funções Embutidas", "oque": "Converte um valor em True ou False.", "exemplo": "bool(1) # Retorna True", "quando": "Responde \"isso vale como sim ou não?\".", "grupo": "Python"}, {"codigo": "callable", "categoria": "Funções Embutidas", "oque": "Verifica se o objeto pode ser usado como função.", "exemplo": "callable(print) # Retorna True", "quando": "Pergunta: \"isso é uma função que dá para executar?\".", "grupo": "Python"}, {"codigo": "chr", "categoria": "Funções Embutidas", "oque": "Retorna o caractere correspondente a um código numérico.", "exemplo": "chr(65) # Retorna 'A'", "quando": "Faz o caminho inverso do ord: número vira letra.", "grupo": "Python"}, {"codigo": "compile", "categoria": "Funções Embutidas", "oque": "Transforma um texto de código em algo que o Python consegue executar depois.", "exemplo": "compile('print(1)', '', 'eval')", "quando": "Prepara um código escrito como texto. Uso avançado.", "grupo": "Python"}, {"codigo": "copyright", "categoria": "Funções Embutidas", "oque": "Exibe o aviso de copyright do Python (uso interativo).", "exemplo": "copyright()", "quando": "Mostra as informações de direitos autorais. Pouco usado.", "grupo": "Python"}, {"codigo": "credits", "categoria": "Funções Embutidas", "oque": "Exibe os créditos do projeto Python (uso interativo).", "exemplo": "credits()", "quando": "Mostra quem criou o Python. Pouco usado.", "grupo": "Python"}, {"codigo": "dir", "categoria": "Funções Embutidas", "oque": "Lista os métodos e atributos disponíveis de um objeto.", "exemplo": "dir([]) # Lista os métodos de listas", "quando": "Mostra \"o que dá para fazer\" com aquele item.", "grupo": "Python"}, {"codigo": "divmod", "categoria": "Funções Embutidas", "oque": "Retorna o quociente e o resto de uma divisão, juntos.", "exemplo": "divmod(9, 4) # Retorna (2, 1)", "quando": "Divide e já mostra o que sobrou: 9 = 4 x 2 + 1.", "grupo": "Python"}, {"codigo": "enumerate", "categoria": "Funções Embutidas", "oque": "Numera os itens de uma lista.", "exemplo": "list(enumerate(['a', 'b'])) # [(0, 'a'), (1, 'b')]", "quando": "Cria uma numeração automática: 0, 1, 2...", "grupo": "Python"}, {"codigo": "eval", "categoria": "Funções Embutidas", "oque": "Executa um texto como se fosse uma conta ou um código.", "exemplo": "eval('2 + 3') # Retorna 5", "quando": "Pega um texto que parece uma conta e faz a conta.", "grupo": "Python"}, {"codigo": "exec", "categoria": "Funções Embutidas", "oque": "Executa um código guardado em forma de texto.", "exemplo": "exec('print(\"Oi\")')", "quando": "Roda um código que está escrito como texto. Uso avançado, com cuidado.", "grupo": "Python"}, {"codigo": "exit", "categoria": "Funções Embutidas", "oque": "Encerra o interpretador Python.", "exemplo": "exit()", "quando": "Fecha o programa ou o terminal de Python.", "grupo": "Python"}, {"codigo": "filter", "categoria": "Funções Embutidas", "oque": "Filtra os itens de uma lista, mantendo só os que passam num teste.", "exemplo": "list(filter(lambda x: x > 0, [-1, 2])) # [2]", "quando": "Funciona como uma peneira: deixa passar só o que você pediu.", "grupo": "Python"}, {"codigo": "format", "categoria": "Funções Embutidas", "oque": "Formata um valor para exibição.", "exemplo": "format(0.5, '%') # Retorna '50.000000%'", "quando": "Muda a aparência de um número, como porcentagem. Use round para deixar menos casas decimais.", "grupo": "Python"}, {"codigo": "hash", "categoria": "Funções Embutidas", "oque": "Gera um código numérico que representa um objeto.", "exemplo": "hash('python')", "quando": "Uma \"impressão digital\" numérica do conteúdo. Uso avançado.", "grupo": "Python"}, {"codigo": "help", "categoria": "Funções Embutidas", "oque": "Abre a ajuda embutida sobre um comando.", "exemplo": "help(print)", "quando": "Mostra a explicação oficial de um comando.", "grupo": "Python"}, {"codigo": "hex", "categoria": "Funções Embutidas", "oque": "Converte um número inteiro para hexadecimal (base 16).", "exemplo": "hex(255) # Retorna '0xff'", "quando": "Outra forma de escrever números, usando também letras de a a f.", "grupo": "Python"}, {"codigo": "id", "categoria": "Funções Embutidas", "oque": "Retorna o endereço de memória de um objeto.", "exemplo": "id(x)", "quando": "O \"número de identidade\" de onde o item está guardado no computador.", "grupo": "Python"}, {"codigo": "input", "categoria": "Funções Embutidas", "oque": "Pede uma informação ao usuário pelo teclado.", "exemplo": "nome = input('Nome: ')", "quando": "Faz o programa perguntar algo e guardar a resposta numa variável.", "grupo": "Python"}, {"codigo": "isinstance", "categoria": "Funções Embutidas", "oque": "Verifica se um objeto é de um tipo específico.", "exemplo": "isinstance(5, int) # Retorna True", "quando": "Pergunta: \"isso é um número inteiro?\".", "grupo": "Python"}, {"codigo": "issubclass", "categoria": "Funções Embutidas", "oque": "Verifica se uma classe é \"filha\" de outra.", "exemplo": "issubclass(bool, int) # Retorna True", "quando": "Pergunta de família: uma categoria faz parte da outra?", "grupo": "Python"}, {"codigo": "iter", "categoria": "Funções Embutidas", "oque": "Cria um percorredor para uma sequência.", "exemplo": "it = iter([1, 2])", "quando": "Prepara algo para ser percorrido item por item.", "grupo": "Python"}, {"codigo": "len", "categoria": "Funções Embutidas", "oque": "Conta quantos itens tem um objeto.", "exemplo": "len([1, 2, 3]) # Retorna 3", "quando": "Conta quantos elementos existem.", "grupo": "Python"}, {"codigo": "license", "categoria": "Funções Embutidas", "oque": "Exibe a licença de uso do Python (uso interativo).", "exemplo": "license()", "quando": "Mostra as regras de uso do Python. Pouco usado.", "grupo": "Python"}, {"codigo": "map", "categoria": "Funções Embutidas", "oque": "Aplica uma função a todos os itens de uma lista.", "exemplo": "list(map(str.upper, ['a', 'b'])) # ['A', 'B']", "quando": "Faz a mesma operação em cada item, de uma vez só.", "grupo": "Python"}, {"codigo": "max", "categoria": "Funções Embutidas", "oque": "Retorna o maior item.", "exemplo": "max([1, 5, 3]) # Retorna 5", "quando": "Acha o maior valor.", "grupo": "Python"}, {"codigo": "min", "categoria": "Funções Embutidas", "oque": "Retorna o menor item.", "exemplo": "min([1, 5, 3]) # Retorna 1", "quando": "Acha o menor valor.", "grupo": "Python"}, {"codigo": "next", "categoria": "Funções Embutidas", "oque": "Pega o próximo item de um percorredor.", "exemplo": "next(it)", "quando": "Pede \"o próximo, por favor\".", "grupo": "Python"}, {"codigo": "oct", "categoria": "Funções Embutidas", "oque": "Converte um número inteiro para octal (base 8).", "exemplo": "oct(8) # Retorna '0o10'", "quando": "Outra forma de escrever números, em base 8.", "grupo": "Python"}, {"codigo": "open", "categoria": "Funções Embutidas", "oque": "Abre um arquivo para ler ou escrever.", "exemplo": "f = open('arquivo.txt', 'r')", "quando": "Abre um arquivo do computador, como abrir um caderno.", "grupo": "Python"}, {"codigo": "ord", "categoria": "Funções Embutidas", "oque": "Retorna o número correspondente a um caractere.", "exemplo": "ord('A') # Retorna 65", "quando": "Faz o caminho inverso do chr: letra vira número.", "grupo": "Python"}, {"codigo": "pow", "categoria": "Funções Embutidas", "oque": "Eleva um número a uma potência.", "exemplo": "pow(2, 3) # Retorna 8", "quando": "Calcula potências: 2 x 2 x 2 = 8.", "grupo": "Python"}, {"codigo": "print", "categoria": "Funções Embutidas", "oque": "Mostra valores na tela.", "exemplo": "print('Olá Mundo')", "quando": "Escreve algo na tela. Provavelmente o comando que você mais vai usar.", "grupo": "Python"}, {"codigo": "quit", "categoria": "Funções Embutidas", "oque": "Igual a exit(): encerra o interpretador.", "exemplo": "quit()", "quando": "Outra forma de fechar o Python.", "grupo": "Python"}, {"codigo": "repr", "categoria": "Funções Embutidas", "oque": "Mostra o objeto como ele foi escrito, com aspas.", "exemplo": "repr('texto') # Retorna \"'texto'\"", "quando": "Mostra o item exatamente como foi digitado, com aspas.", "grupo": "Python"}, {"codigo": "reversed", "categoria": "Funções Embutidas", "oque": "Inverte a ordem de uma sequência.", "exemplo": "list(reversed([1, 2])) # [2, 1]", "quando": "Vira a lista de trás para frente.", "grupo": "Python"}, {"codigo": "round", "categoria": "Funções Embutidas", "oque": "Arredonda um número.", "exemplo": "round(3.1415, 2) # Retorna 3.14", "quando": "Corta as casas decimais que você não quer.", "grupo": "Python"}, {"codigo": "sorted", "categoria": "Funções Embutidas", "oque": "Retorna uma nova lista em ordem crescente.", "exemplo": "sorted([3, 1, 2]) # [1, 2, 3]", "quando": "Organiza a lista do menor para o maior, sem mexer na original.", "grupo": "Python"}, {"codigo": "sum", "categoria": "Funções Embutidas", "oque": "Soma todos os itens.", "exemplo": "sum([1, 2, 3]) # Retorna 6", "quando": "Soma tudo de uma vez.", "grupo": "Python"}, {"codigo": "type", "categoria": "Funções Embutidas", "oque": "Informa o tipo de um objeto.", "exemplo": "type(10) # Retorna <class 'int'>", "quando": "Diz que tipo de coisa é aquilo: número, texto, lista...", "grupo": "Python"}, {"codigo": "vars", "categoria": "Funções Embutidas", "oque": "Mostra os atributos de um objeto.", "exemplo": "vars(obj)", "quando": "Lista as características guardadas dentro de um objeto.", "grupo": "Python"}, {"codigo": "zip", "categoria": "Funções Embutidas", "oque": "Junta itens de duas ou mais listas, um a um.", "exemplo": "list(zip([1, 2], ['a', 'b'])) # [(1, 'a'), (2, 'b')]", "quando": "Emparelha as listas como um zíper: 1 com 'a', 2 com 'b'.", "grupo": "Python"}, {"codigo": "with", "categoria": "Gerenciamento de Contexto", "oque": "Abre um recurso e garante que ele será fechado no fim.", "exemplo": "with open('file.txt') as f: ...", "quando": "Como pegar algo emprestado e devolver sozinho: o arquivo fecha automaticamente.", "grupo": "Python"}, {"codigo": ".gitignore", "categoria": "Git – Arquivos", "oque": "Lista de arquivos e pastas que o Git deve ignorar, como senhas e dados sensíveis.", "exemplo": "*.xlsx, .env, __pycache__/", "quando": "Antes do primeiro commit, para não enviar dados sensíveis ao GitHub.", "grupo": "Git"}, {"codigo": "commit atômico", "categoria": "Git – Boas práticas", "oque": "Cada commit deve guardar uma única mudança com sentido. Evite juntar muitas mudanças não relacionadas num commit só.", "exemplo": "Um commit para o filtro e outro para o gráfico", "quando": "Para que o histórico seja fácil de entender e de desfazer.", "grupo": "Git"}, {"codigo": "mensagem de commit descritiva", "categoria": "Git – Boas práticas", "oque": "Mensagem que explica o que mudou, de forma clara. Evite mensagens vagas.", "exemplo": "\"Adiciona filtro por Região Sul\" em vez de \"atualiza script\"", "quando": "Sempre que fizer um commit.", "grupo": "Git"}, {"codigo": "branch (ramificação)", "categoria": "Git – Conceitos", "oque": "Linha de trabalho paralela. Você cria uma branch, trabalha nela sem mexer na principal e, depois, une (merge) ou apaga.", "exemplo": "git switch -c nova-tela-login", "quando": "Para testar ideias sem risco de quebrar o projeto principal.", "grupo": "Git"}, {"codigo": "controle de versão", "categoria": "Git – Conceitos", "oque": "Forma de guardar o histórico de cada alteração do projeto, para poder voltar atrás e saber quem mudou o quê.", "exemplo": "analise_final.py, analise_final_v2.py... no lugar disso, o Git guarda o histórico", "quando": "Para entender por que usar Git em vez de criar cópias de arquivos.", "grupo": "Git"}, {"codigo": "Git", "categoria": "Git – Conceitos", "oque": "Ferramenta instalada no seu computador que controla o histórico de versões. Funciona sem internet. Criada por Linus Torvalds em 2005.", "exemplo": "git init", "quando": "Para entender a diferença entre Git e GitHub.", "grupo": "Git"}, {"codigo": "HEAD", "categoria": "Git – Conceitos", "oque": "Marcador que indica a versão que você está usando agora. Aparece nos avisos de conflito.", "exemplo": "<<<<<<< HEAD", "quando": "Para entender o que o Git está mostrando em um conflito.", "grupo": "Git"}, {"codigo": "main", "categoria": "Git – Conceitos", "oque": "Nome da branch principal do projeto (significa \"principal\"). Antigamente se chamava master.", "exemplo": "git push origin main", "quando": "Ao enviar o projeto para o GitHub.", "grupo": "Git"}, {"codigo": "repositório", "categoria": "Git – Conceitos", "oque": "Pasta do projeto monitorada pelo Git, com todo o histórico de alterações. Também chamado de repo.", "exemplo": "git init cria um repositório", "quando": "Para entender onde o Git guarda o histórico do projeto.", "grupo": "Git"}, {"codigo": "área de preparação (staging)", "categoria": "Git – Conceitos", "oque": "Lugar intermediário onde ficam os arquivos prontos para o próximo commit, depois do git add.", "exemplo": "git add . e depois git commit", "quando": "Para entender por que é preciso \"adicionar\" antes de salvar.", "grupo": "Git"}, {"codigo": "git remote", "categoria": "Git – Conexão com GitHub", "oque": "Mostra os endereços remotos (o GitHub) ligados ao projeto do seu computador. Só consulta, não altera nada.", "exemplo": "git remote -v", "quando": "Para conferir se o projeto está ligado ao GitHub.", "grupo": "Git"}, {"codigo": "origin", "categoria": "Git – Conexão com GitHub", "oque": "Apelido padrão do endereço do GitHub do projeto, para não precisar digitar o link inteiro.", "exemplo": "git push origin main", "quando": "Ao enviar ou baixar alterações do GitHub.", "grupo": "Git"}, {"codigo": "git config --global user.email", "categoria": "Git – Configuração", "oque": "Define o seu e-mail, usado junto com o nome nos registros.", "exemplo": "git config --global user.email \"seu@email.com\"", "quando": "Uma vez só, junto com o nome.", "grupo": "Git"}, {"codigo": "git config --global user.name", "categoria": "Git – Configuração", "oque": "Define o seu nome, que fica registrado em cada alteração salva.", "exemplo": "git config --global user.name \"Seu Nome\"", "quando": "Uma vez só, logo depois de instalar o Git.", "grupo": "Git"}, {"codigo": "feature/", "categoria": "Git – Nomes de branch", "oque": "Prefixo para branch de uma nova funcionalidade.", "exemplo": "feature/analise-por-regiao", "quando": "Ao nomear uma branch nova.", "grupo": "Git"}, {"codigo": "fix/", "categoria": "Git – Nomes de branch", "oque": "Prefixo para branch de correção de erro.", "exemplo": "fix/correcao-valores-nulos", "quando": "Ao nomear uma branch de correção.", "grupo": "Git"}, {"codigo": "hotfix/", "categoria": "Git – Nomes de branch", "oque": "Prefixo para correção urgente de um erro crítico.", "exemplo": "hotfix/script-exportacao", "quando": "Quando um erro grave precisa ser corrigido rápido.", "grupo": "Git"}, {"codigo": "release/", "categoria": "Git – Nomes de branch", "oque": "Prefixo para preparar uma versão pronta para entrega.", "exemplo": "release/v1.2-relatorio-bi", "quando": "Quando uma versão do projeto está pronta para ser entregue.", "grupo": "Git"}, {"codigo": "-m", "categoria": "Git – Parâmetros", "oque": "Avisa que a mensagem do commit vem logo depois (m de \"message\", mensagem).", "exemplo": "git commit -m \"Corrige cálculo do IMC\"", "quando": "Sempre que usar commit com mensagem.", "grupo": "Git"}, {"codigo": "-u", "categoria": "Git – Parâmetros", "oque": "Liga a branch do seu computador à branch do GitHub. Depois disso, basta digitar git push.", "exemplo": "git push -u origin main", "quando": "Na primeira vez que enviar uma branch.", "grupo": "Git"}, {"codigo": "-v", "categoria": "Git – Parâmetros", "oque": "Significa \"verbose\": mostra mais detalhes na tela (v de \"verbose\", detalhado).", "exemplo": "git remote -v", "quando": "Para ver os endereços completos do projeto.", "grupo": "Git"}, {"codigo": "conflito de merge", "categoria": "Git – Problemas comuns", "oque": "Acontece quando duas pessoas alteram a mesma linha do mesmo arquivo. O Git para e pede que você escolha qual versão manter.", "exemplo": "Marcadores <<<<<<< HEAD, ======= e >>>>>>> feature/media-vendas", "quando": "Quando o Git avisar de conflito durante um merge. Resolva: escolha a versão certa, apague os marcadores, salve, faça git add e commit.", "grupo": "Git"}, {"codigo": "git branch", "categoria": "Git – Ramificações", "oque": "Lista as branches do projeto ou cria uma nova. Branch é uma linha paralela de trabalho, como um ramo de árvore.", "exemplo": "git branch teste", "quando": "Para criar uma linha separada de testes sem mexer na principal.", "grupo": "Git"}, {"codigo": "git branch -d", "categoria": "Git – Ramificações", "oque": "Apaga uma branch que já foi unida (merge) e não é mais necessária.", "exemplo": "git branch -d teste-imc", "quando": "Limpeza, depois de fazer merge.", "grupo": "Git"}, {"codigo": "git branch -M", "categoria": "Git – Ramificações", "oque": "Renomeia a branch atual. Usado para trocar o nome antigo \"master\" por \"main\".", "exemplo": "git branch -M main", "quando": "Ao começar um projeto, se o nome padrão for master.", "grupo": "Git"}, {"codigo": "git merge", "categoria": "Git – Ramificações", "oque": "Une as alterações de outra branch à branch em que você está.", "exemplo": "git merge teste-imc", "quando": "Quando a ideia nova estiver pronta e testada, para trazê-la para a principal.", "grupo": "Git"}, {"codigo": "git switch", "categoria": "Git – Ramificações", "oque": "Muda para outra branch.", "exemplo": "git switch main", "quando": "Para voltar à linha principal ou ir para outra tarefa.", "grupo": "Git"}, {"codigo": "git switch -c", "categoria": "Git – Ramificações", "oque": "Cria uma branch nova e já muda para ela (c de \"create\", criar).", "exemplo": "git switch -c teste-imc", "quando": "Ao começar um teste ou uma funcionalidade isolada.", "grupo": "Git"}, {"codigo": "git checkout", "categoria": "Git – Ramificações (comando antigo)", "oque": "Muda de branch. Faz o mesmo que git switch, mas é mais antigo e ainda aparece em muitos tutoriais.", "exemplo": "git checkout main", "quando": "Quando encontrar em tutoriais antigos.", "grupo": "Git"}, {"codigo": "git checkout -b", "categoria": "Git – Ramificações (comando antigo)", "oque": "Cria uma branch nova e muda para ela. Equivale ao git switch -c.", "exemplo": "git checkout -b feature/analise-regiao", "quando": "Quando encontrar em materiais antigos ou em aulas.", "grupo": "Git"}, {"codigo": "git clone", "categoria": "Git – Repositório", "oque": "Copia um projeto do GitHub para o seu computador, com todo o histórico de versões.", "exemplo": "git clone https://github.com/usuario/projeto.git", "quando": "Quando quer trabalhar em um projeto que já existe no GitHub, ou para simular outro computador.", "grupo": "Git"}, {"codigo": "git init", "categoria": "Git – Repositório", "oque": "Transforma a pasta atual em um projeto que o Git acompanha. Cria a pasta oculta .git, onde fica o histórico.", "exemplo": "git init", "quando": "Ao começar um projeto novo no seu computador.", "grupo": "Git"}, {"codigo": "git add", "categoria": "Git – Salvar alterações", "oque": "Prepara arquivos alterados para entrar no próximo commit (fica na \"área de preparação\").", "exemplo": "git add .", "quando": "Antes de fazer commit. O ponto (.) significa \"todos os arquivos da pasta\".", "grupo": "Git"}, {"codigo": "git commit", "categoria": "Git – Salvar alterações", "oque": "Salva o estado atual dos arquivos como uma \"fotografia\" do projeto, com uma mensagem explicando a mudança.", "exemplo": "git commit -m \"Adiciona análise de vendas\"", "quando": "Sempre que terminar uma mudança que tenha sentido sozinha.", "grupo": "Git"}, {"codigo": "git pull", "categoria": "Git – Sincronizar com GitHub", "oque": "Baixa do GitHub as novidades e junta ao seu computador.", "exemplo": "git pull", "quando": "Antes de começar a trabalhar, para pegar o que foi alterado no GitHub.", "grupo": "Git"}, {"codigo": "git push", "categoria": "Git – Sincronizar com GitHub", "oque": "Envia os commits do seu computador para o GitHub.", "exemplo": "git push origin main", "quando": "Depois de fazer commit, quando quer publicar a mudança no GitHub.", "grupo": "Git"}, {"codigo": "git --version", "categoria": "Git – Verificação", "oque": "Mostra a versão do Git instalada no computador.", "exemplo": "git --version", "quando": "Para confirmar que a instalação do Git deu certo (no Git Bash).", "grupo": "Git"}, {"codigo": "README.md", "categoria": "GitHub – Arquivos", "oque": "Arquivo de apresentação do projeto. É o primeiro que aparece na página do repositório no GitHub.", "exemplo": "Um README com a descrição do projeto", "quando": "Para explicar o objetivo, as pastas e como executar o projeto.", "grupo": "Git"}, {"codigo": "pull request", "categoria": "GitHub – Colaboração", "oque": "Pedido para unir alterações de um projeto. Permite revisar e discutir o código antes de juntá-lo à principal.", "exemplo": "Abrir uma pull request no GitHub", "quando": "Quando trabalha em equipe e quer revisão antes de aceitar a mudança.", "grupo": "Git"}, {"codigo": "GitHub", "categoria": "GitHub – Conceitos", "oque": "Plataforma online que guarda projetos Git na nuvem e facilita o trabalh otecas"}, {"codigo": "pd.read_excel()", "categoria": "Leitura de Dados (Pandas)", "oque": "Lê uma planilha Excel (.xlsx ou .xls) e cria uma tabela.", "exemplo": "df = pd.read_excel(\"vendas.xlsx\")", "quando": "quando os dados estiverem numa planilha Excel.", "grupo": "Bibliotecas"}, {"codigo": "pd.read_json()", "categoria": "Leitura de Dados (Pandas)", "oque": "Lê um arquivo JSON e cria uma tabela.", "exemplo": "df = pd.read_json(\"vendas.json\")", "quando": "quando os dados vierem de sistemas ou APIs em formato JSON.", "grupo": "Bibliotecas"}, {"codigo": "pd.read_sql()", "categoria": "Leitura de Dados (Pandas)", "oque": "Lê o resultado de uma consulta SQL direto de um banco de dados.", "exemplo": "df = pd.read_sql(\"SELECT * FROM vendas\", conexao)", "quando": "quando os dados estão num banco de dados.", "grupo": "Bibliotecas"}, {"codigo": ".astype()", "categoria": "Limpeza (Pandas)", "oque": "Converte o tipo de uma coluna.", "exemplo": "df[\"Valor_Venda\"].astype(float)", "quando": "quando um número está salvo como texto.", "grupo": "Bibliotecas"}, {"codigo": ".drop()", "categoria": "Limpeza (Pandas)", "oque": "Remove colunas ou linhas.", "exemplo": "df.drop(columns=[\"Canal\"])", "quando": "para tirar colunas que não serão usadas.", "grupo": "Bibliotecas"}, {"codigo": ".drop_duplicates()", "categoria": "Limpeza (Pandas)", "oque": "Remove linhas repetidas.", "exemplo": "df.drop_duplicates()", "quando": "quando a importação duplicou registros. Confirme antes que a repetição não é uma venda real.", "grupo": "Bibliotecas"}, {"codigo": ".dropna()", "categoria": "Limpeza (Pandas)", "oque": "Remove linhas (ou colunas) que têm valores vazios.", "exemplo": "df.dropna()", "quando": "quando linhas incompletas não servem para a análise.", "grupo": "Bibliotecas"}, {"codigo": ".duplicated()", "categoria": "Limpeza (Pandas)", "oque": "Marca as linhas que se repetem.", "exemplo": "df.duplicated().sum()", "quando": "para contar duplicatas antes de decidir apagá-las.", "grupo": "Bibliotecas"}, {"codigo": ".fillna()", "categoria": "Limpeza (Pandas)", "oque": "Preenche células vazias com um valor escolhido.", "exemplo": "df[\"Valor_Venda\"].fillna(0)", "quando": "quando o vazio deve virar zero ou outro valor padrão.", "grupo": "Bibliotecas"}, {"codigo": ".isna()", "categoria": "Limpeza (Pandas)", "oque": "Marca True onde a célula está vazia.", "exemplo": "df.isna().sum()", "quando": "para contar células vazias por coluna antes de analisar.", "grupo": "Bibliotecas"}, {"codigo": ".notna()", "categoria": "Limpeza (Pandas)", "oque": "Marca True onde a célula está preenchida. É o contrário do isna.", "exemplo": "df[df[\"Valor_Venda\"].notna()]", "quando": "para trabalhar só com linhas que têm valor.", "grupo": "Bibliotecas"}, {"codigo": ".rename()", "categoria": "Limpeza (Pandas)", "oque": "Troca o nome de colunas.", "exemplo": "df.rename(columns={\"Valor_Venda\": \"Valor\"})", "quando": "para deixar os nomes das colunas mais claros.", "grupo": "Bibliotecas"}, {"codigo": ".replace()", "categoria": "Limpeza (Pandas)", "oque": "Troca um valor por outro em toda a coluna.", "exemplo": "df[\"Região\"].replace(\"Joinvile\", \"Joinville\")", "quando": "para corrigir o mesmo erro de digitação em muitas linhas.", "grupo": "Bibliotecas"}, {"codigo": "pd.to_numeric()", "categoria": "Limpeza (Pandas)", "oque": "Converte texto em número. Com errors=\"coerce\", valores inválidos viram vazio.", "exemplo": "pd.to_numeric(df[\"Valor\"], errors=\"coerce\")", "quando": "quando um número veio com símbolos ou letras no meio.", "grupo": "Bibliotecas"}, {"codigo": ".sort()", "categoria": "Listas (métodos)", "oque": "Coloca os itens da lista em ordem. Ele altera a própria lista e não devolve nada, por isso print(lista.sort()) mostra None.", "exemplo": "texto.sort()", "quando": "Para organizar uma lista. Chame o .sort() sozinho e depois mostre a lista.", "grupo": "Python"}, {"codigo": ".sort() (lista)", "categoria": "Listas (Python)", "oque": "Ordena a própria lista, sem
